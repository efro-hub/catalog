<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Каталог товаров</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 16px;
            background: #ffffff;
            color: #111111;
            font-family: Arial, sans-serif;
        }

        h1 {
            margin: 5px 0 20px;
            font-size: 24px;
        }

        #products {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .product {
            border: 1px solid #eeeeee;
            border-radius: 14px;
            overflow: hidden;
            background: #ffffff;
        }

        .product img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
        }

        .info {
            padding: 12px;
        }

        .name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .price {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .description {
            font-size: 13px;
            color: #777777;
            line-height: 1.3;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 10px;
            color: #777777;
        }

        .error {
            grid-column: 1 / -1;
            padding: 20px;
            color: #cc0000;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>Каталог товаров</h1>

    <div id="products">
        <div class="empty">
            Загрузка товаров...
        </div>
    </div>


    <script>

        const tg = window.Telegram.WebApp;

        tg.ready();
        tg.expand();


        async function loadProducts() {

            const container =
                document.getElementById("products");


            try {

                /*
                 * Берём products.json
                 * прямо из этого же GitHub Pages.
                 *
                 * ?time нужен, чтобы Telegram
                 * не показывал старую версию.
                 */

                const url =
                    "products.json?time=" +
                    Date.now();


                const response =
                    await fetch(url);


                if (!response.ok) {

                    throw new Error(
                        "HTTP " + response.status
                    );

                }


                const products =
                    await response.json();


                container.innerHTML = "";


                if (
                    !Array.isArray(products) ||
                    products.length === 0
                ) {

                    container.innerHTML = `
                        <div class="empty">
                            Каталог пока пуст
                        </div>
                    `;

                    return;
                }


                products.forEach(product => {

                    const card =
                        document.createElement("div");

                    card.className =
                        "product";


                    const image =
                        product.image || "";


                    card.innerHTML = `

                        ${
                            image
                            ? `
                                <img
                                    src="${image}"
                                    alt=""
                                    onerror="
                                        this.style.display='none'
                                    "
                                >
                              `
                            : ""
                        }

                        <div class="info">

                            <div class="name">
                                ${escapeHtml(
                                    product.name || ""
                                )}
                            </div>

                            <div class="price">
                                ${escapeHtml(
                                    product.price || ""
                                )}
                            </div>

                            ${
                                product.description
                                ? `
                                    <div class="description">
                                        ${escapeHtml(
                                            product.description
                                        )}
                                    </div>
                                  `
                                : ""
                            }

                        </div>
                    `;


                    container.appendChild(card);

                });


            } catch (error) {

                console.error(error);


                container.innerHTML = `

                    <div class="error">

                        Не удалось загрузить каталог.

                        <br><br>

                        ${escapeHtml(
                            error.message
                        )}

                    </div>

                `;

            }

        }


        function escapeHtml(text) {

            const div =
                document.createElement("div");

            div.textContent = text;

            return div.innerHTML;

        }


        loadProducts();

    </script>

</body>
</html>
