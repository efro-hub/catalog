<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta
    http-equiv="Cache-Control"
    content="no-cache, no-store, must-revalidate"
>

<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>IXwear</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>

<style>

/* =====================================================
   GLOBAL
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;

    background: #080808;
    color: #fff;
}

body {
    overflow-x: hidden;

    font-family:
        "Cormorant Garamond",
        serif;
}


/* =====================================================
   HEADER
===================================================== */

.header {
    width: 100%;
    height: 92px;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            ellipse at center,
            #171717 0%,
            #0d0d0d 55%,
            #080808 100%
        );

    border-bottom: 1px solid #242424;

    border-radius:
        0 0 24px 24px;
}


/* =====================================================
   LOGO
===================================================== */

.logo {
    display: flex;

    align-items: baseline;

    white-space: nowrap;

    line-height: 1;

    text-shadow:
        0 2px 8px rgba(0,0,0,.9);
}

.logo-ix {
    font-family:
        "Cinzel",
        serif;

    font-size: 40px;

    font-weight: 600;

    letter-spacing: -2px;

    color: #f1f1f1;
}

.logo-wear {
    margin-left: 4px;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size: 28px;

    font-weight: 500;

    letter-spacing: 1px;

    color: #bdbdbd;
}


/* =====================================================
   MAIN
===================================================== */

main {
    width: 100%;

    max-width: 1100px;

    margin: 0 auto;

    padding:
        32px 30px 70px;
}


/* =====================================================
   TITLE
===================================================== */

.catalog-title {
    text-align: center;

    margin-bottom: 48px;
}

.title-line {
    display: flex;

    align-items: center;

    justify-content: center;

    gap: 18px;
}

.title-decoration {
    width: 68px;
    height: 20px;

    position: relative;
}

.title-decoration::before {
    content: "❧";

    position: absolute;

    left: 0;
    top: -8px;

    font-size: 24px;

    color: #737373;

    transform:
        rotate(180deg);
}

.title-decoration::after {
    content: "◇";

    position: absolute;

    right: 0;
    top: -5px;

    font-size: 14px;

    color: #555;
}

.title-decoration.right {
    transform:
        scaleX(-1);
}

.catalog-title h1 {
    margin: 0;

    font-family:
        "Cinzel",
        serif;

    font-size: 29px;

    font-weight: 500;

    letter-spacing: 5px;

    color: #e8e8e8;
}

.catalog-subtitle {
    margin-top: 9px;

    font-size: 21px;

    letter-spacing: 1px;

    color: #999;
}


/* =====================================================
   PRODUCTS
===================================================== */

#products {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    column-gap: 55px;

    row-gap: 70px;
}

.product {
    min-width: 0;

    text-align: center;

    animation:
        productAppear .55s ease both;
}

@keyframes productAppear {

    from {
        opacity: 0;

        transform:
            translateY(18px);
    }

    to {
        opacity: 1;

        transform:
            translateY(0);
    }
}


/* =====================================================
   BAROQUE FRAME
===================================================== */

.frame {

    position: relative;

    width: 100%;

    aspect-ratio:
        .78 / 1;

    background:
        #fdfdfd;

    border:
        14px solid #e5e4e0;

    border-radius:
        2px;

    padding:
        12%;

    overflow: visible;

    isolation: isolate;

    box-shadow:

        0 0 0 2px #ffffff,

        0 0 0 6px #dcdbd7,

        inset 0 0 25px rgba(0,0,0,.25),

        inset 0 0 0 6px #e2dfda,

        inset 0 0 0 12px #ffffff,

        inset 0 0 40px rgba(0,0,0,.15),

        0 18px 35px rgba(0,0,0,.75),

        0 8px 16px rgba(0,0,0,.5);
}


/* =====================================================
   DEEP FRAME RELIEF
===================================================== */

.frame::before {

    content: "";

    position: absolute;

    inset: -8px;

    z-index: 8;

    pointer-events: none;

    border:
        4px solid #ffffff;

    box-shadow:

        inset
        0 0 0 3px #cfcfcb,

        inset
        0 0 0 7px #f8f8f6,

        inset
        0 0 14px rgba(0,0,0,.22),

        0 0 0 2px #d2d1cc;
}


/* =====================================================
   INNER FRAME
===================================================== */

.frame-inner {

    position: absolute;

    top: 10%;
    left: 10%;
    right: 10%;
    bottom: 10%;

    z-index: 3;

    background:
        #fff;

    border:
        4px double #b5b3ad;

    padding:
        10px;

    box-shadow:

        inset
        0 0 15px rgba(0,0,0,.15),

        0 0 0 4px #fff,

        0 0 10px rgba(0,0,0,.1);
}


/* =====================================================
   PRODUCT PHOTO
===================================================== */

.image-area {

    width: 100%;
    height: 100%;

    position: relative;

    overflow: hidden;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        radial-gradient(
            ellipse at center,
            #171717 0%,
            #0b0b0b 65%,
            #020202 100%
        );

    border:
        1px solid #000;

    box-shadow:
        inset 0 0 30px rgba(0,0,0,.8);
}


/* =====================================================
   PRODUCT IMAGE
===================================================== */

.product img.product-image {

    width: 100%;

    height: 100%;

    object-fit: contain;

    display: block;

    position: relative;

    z-index: 2;
}


/* =====================================================
   INNER CORNER ORNAMENTS
===================================================== */

.corner-decor {

    position: absolute;

    width: 32px;
    height: 32px;

    border:
        2px solid #b5b3ad;

    z-index: 10;

    pointer-events: none;
}

.corner-decor::before {

    content: "";

    position: absolute;

    top: 3px;
    left: 3px;
    right: 3px;
    bottom: 3px;

    border:
        1px dashed #c2c0b8;
}


/* TOP LEFT */

.c-tl {
    top: -6px;
    left: -6px;

    border-right: none;
    border-bottom: none;
}


/* TOP RIGHT */

.c-tr {
    top: -6px;
    right: -6px;

    border-left: none;
    border-bottom: none;
}


/* BOTTOM LEFT */

.c-bl {
    bottom: -6px;
    left: -6px;

    border-right: none;
    border-top: none;
}


/* BOTTOM RIGHT */

.c-br {
    bottom: -6px;
    right: -6px;

    border-left: none;
    border-top: none;
}


/* =====================================================
   IXWEAR ENGRAVING
===================================================== */

.frame-brand {

    position: absolute;

    top: 5px;

    left: 50%;

    transform:
        translateX(-50%);

    z-index: 20;

    font-family:
        "Times New Roman",
        serif;

    font-size: 13px;

    font-weight: bold;

    letter-spacing: 3px;

    color: #a3a19a;

    white-space: nowrap;

    text-shadow:
        1px 1px 0 #fff,
        -1px -1px 1px rgba(0,0,0,.15);
}


/* =====================================================
   BOTTOM ORNAMENT
===================================================== */

.frame-ornament {

    position: absolute;

    bottom: 4px;

    left: 50%;

    transform:
        translateX(-50%);

    z-index: 20;

    font-size: 9px;

    letter-spacing: 5px;

    color: #b5b3ad;

    text-shadow:
        1px 1px 0 #fff;

    white-space: nowrap;
}


/* =====================================================
   PRODUCT INFO
===================================================== */

.info {
    padding-top: 35px;

    text-align: center;
}

.name {

    font-family:
        "Cormorant Garamond",
        serif;

    font-size: 24px;

    line-height: 1.15;

    color: #eee;

    font-weight: 500;
}

.price {

    margin-top: 6px;

    font-family:
        "Cinzel",
        serif;

    font-size: 21px;

    letter-spacing: 2px;

    color: #fff;

    font-weight: 500;
}

.description {

    margin-top: 6px;

    color: #777;

    font-size: 15px;
}


/* =====================================================
   STATES
===================================================== */

.loading,
.empty,
.error {

    grid-column:
        1 / -1;

    text-align: center;

    padding:
        70px 10px;

    font-size: 21px;

    color: #777;
}

.error {
    color: #c77;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .header {
        height: 92px;

        border-radius:
            0 0 22px 22px;
    }


    .logo-ix {
        font-size: 37px;
    }

    .logo-wear {
        font-size: 26px;
    }


    main {
        padding:
            29px 15px 55px;
    }


    .catalog-title {
        margin-bottom: 42px;
    }


    .catalog-title h1 {

        font-size: 20px;

        letter-spacing: 3px;
    }


    .catalog-subtitle {
        font-size: 18px;
    }


    .title-decoration {
        width: 43px;
    }


    #products {

        column-gap: 25px;

        row-gap: 60px;
    }


    /* ============================
       MOBILE FRAME
    ============================ */

    .frame {

        border-width: 9px;

        padding: 12%;

        box-shadow:

            0 0 0 2px #fff,

            0 0 0 5px #dcdbd7,

            inset 0 0 15px rgba(0,0,0,.25),

            inset 0 0 0 5px #e2dfda,

            inset 0 0 0 9px #fff,

            inset 0 0 25px rgba(0,0,0,.15),

            0 10px 22px rgba(0,0,0,.75);
    }


    .frame::before {

        inset: -6px;

        border-width: 3px;

        box-shadow:

            inset 0 0 0 2px #cfcfcb,

            inset 0 0 0 5px #f8f8f6,

            inset 0 0 10px rgba(0,0,0,.22),

            0 0 0 2px #d2d1cc;
    }


    .frame-inner {

        top: 10%;
        left: 10%;
        right: 10%;
        bottom: 10%;

        border-width: 3px;

        padding: 7px;
    }


    .corner-decor {

        width: 24px;
        height: 24px;

        border-width: 1px;
    }


    .corner-decor::before {

        border-width: 1px;

        top: 2px;
        left: 2px;
        right: 2px;
        bottom: 2px;
    }


    .c-tl {
        top: -4px;
        left: -4px;
    }

    .c-tr {
        top: -4px;
        right: -4px;
    }

    .c-bl {
        bottom: -4px;
        left: -4px;
    }

    .c-br {
        bottom: -4px;
        right: -4px;
    }


    .frame-brand {

        top: 3px;

        font-size: 9px;

        letter-spacing: 2px;
    }


    .frame-ornament {

        bottom: 2px;

        font-size: 7px;

        letter-spacing: 3px;
    }


    .info {
        padding-top: 29px;
    }


    .name {
        font-size: 17px;
    }


    .price {
        font-size: 15px;

        letter-spacing: 1px;
    }


    .description {
        font-size: 12px;
    }
}


/* =====================================================
   VERY SMALL PHONES
===================================================== */

@media (max-width: 380px) {

    main {
        padding-left: 11px;
        padding-right: 11px;
    }


    .logo-ix {
        font-size: 34px;
    }

    .logo-wear {
        font-size: 24px;
    }


    #products {
        column-gap: 19px;
    }


    .name {
        font-size: 15px;
    }


    .price {
        font-size: 14px;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div class="logo">

        <span class="logo-ix">
            IX
        </span>

        <span class="logo-wear">
            wear
        </span>

    </div>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main>

    <section class="catalog-title">

        <div class="title-line">

            <span class="title-decoration"></span>

            <h1>
                COLLECTION
            </h1>

            <span
                class="title-decoration right"
            ></span>

        </div>

        <div class="catalog-subtitle">
            CHOOSE YOUR STYLE
        </div>

    </section>


    <div id="products">

        <div class="loading">
            Loading collection...
        </div>

    </div>

</main>


<script>

/* =====================================================
   TELEGRAM
===================================================== */

const tg =
    window.Telegram.WebApp;

tg.ready();

tg.expand();


/* =====================================================
   CONTAINER
===================================================== */

const container =
    document.getElementById(
        "products"
    );


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        String(text);

    return div.innerHTML;
}


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts() {

    try {

        const cacheBuster =
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2);


        const response =
            await fetch(
                "products.json?cache=" +
                cacheBuster,
                {
                    method: "GET",

                    cache: "no-store",

                    headers: {
                        "Cache-Control":
                            "no-cache",

                        "Pragma":
                            "no-cache"
                    }
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }


        const products =
            await response.json();


        if (
            !Array.isArray(
                products
            )
        ) {

            throw new Error(
                "products.json имеет неправильный формат"
            );
        }


        if (
            products.length === 0
        ) {

            container.innerHTML = `

                <div class="empty">
                    Collection is empty
                </div>

            `;

            return;
        }


        let html = "";


        /* =================================================
           CREATE PRODUCTS
        ================================================= */

        products.forEach(
            (product, index) => {

                const name =
                    escapeHtml(
                        product.name || ""
                    );


                const price =
                    escapeHtml(
                        product.price || ""
                    );


                const description =
                    escapeHtml(
                        product.description || ""
                    );


                const imageUrl =
                    product.image
                        ? product.image +
                          (
                              product.image.includes("?")
                              ? "&"
                              : "?"
                          ) +
                          "v=" +
                          Date.now()
                        : "";


                html += `

                    <article
                        class="product"
                        style="
                            animation-delay:
                            ${index * 0.06}s;
                        "
                    >

                        <div class="frame">


                            <!-- =================================
                                 INNER FRAME
                            ================================= -->

                            <div class="frame-inner">


                                <!-- =============================
                                     CORNERS
                                ============================== -->

                                <div
                                    class="corner-decor c-tl"
                                ></div>

                                <div
                                    class="corner-decor c-tr"
                                ></div>

                                <div
                                    class="corner-decor c-bl"
                                ></div>

                                <div
                                    class="corner-decor c-br"
                                ></div>


                                <!-- =============================
                                     PRODUCT PHOTO
                                ============================== -->

                                <div class="image-area">

                                    ${
                                        imageUrl
                                        ? `

                                            <img
                                                class="product-image"

                                                src="${imageUrl}"

                                                alt="${name}"

                                                loading="lazy"

                                                onerror="
                                                    this.style.display='none';
                                                "
                                            >

                                        `
                                        : ""
                                    }

                                </div>

                            </div>


                            <!-- ================================
                                 IXWEAR
                            ================================= -->

                            <div class="frame-brand">
                                IXwear
                            </div>


                            <!-- ================================
                                 BOTTOM ORNAMENT
                            ================================= -->

                            <div class="frame-ornament">
                                ❖ ❖ ❖
                            </div>


                        </div>


                        <!-- =====================================
                             PRODUCT INFORMATION
                        ====================================== -->

                        <div class="info">

                            <div class="name">

                                ${name}

                            </div>


                            <div class="price">

                                ${price}

                            </div>


                            ${
                                description
                                ? `

                                    <div class="description">

                                        ${description}

                                    </div>

                                `
                                : ""
                            }

                        </div>


                    </article>

                `;
            }
        );


        container.innerHTML =
            html;


    } catch (error) {

        console.error(
            "Ошибка загрузки каталога:",
            error
        );


        container.innerHTML = `

            <div class="error">

                Could not load collection.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;
    }
}


/* =====================================================
   START
===================================================== */

loadProducts();


/* =====================================================
   AUTO UPDATE
===================================================== */

setInterval(
    loadProducts,
    3000
);

</script>

</body>
</html>
