<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IXwear</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #f5f3ef;
            color: #171717;
            font-family: Georgia, "Times New Roman", serif;
            min-height: 100vh;
        }

        /* HEADER */

        header {
            text-align: center;
            padding: 28px 15px 18px;
        }

        .logo {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 31px;
            letter-spacing: 7px;
            font-weight: 400;
        }

        .catalog-title {
            margin-top: 7px;
            font-size: 12px;
            letter-spacing: 5px;
            text-transform: uppercase;
            opacity: 0.55;
        }

        /* CATALOG */

        .catalog {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 10px 14px 40px;

            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        /* PRODUCT */

        .product {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1.12;
            overflow: hidden;
        }

        /* PHOTO */

        .product-photo {
            position: absolute;

            /*
             * Размер отверстия внутри рамки.
             * Если нужно увеличить/уменьшить фото —
             * меняй эти значения.
             */

            width: 67%;
            height: 67%;

            left: 16.5%;
            top: 16.5%;

            object-fit: cover;

            z-index: 1;
        }

        /* FRAME */

        .frame {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: fill;

            z-index: 3;

            pointer-events: none;
        }

        /* IXWEAR UNDER FRAME */

        .brand {
            position: absolute;

            left: 50%;
            bottom: 7%;

            transform: translateX(-50%);

            z-index: 4;

            font-family: Georgia, "Times New Roman", serif;
            font-size: 12px;
            letter-spacing: 4px;
            white-space: nowrap;

            color: #151515;
        }

        /* PRICE */

        .price {
            text-align: center;
            margin-top: -2px;

            font-family: Arial, sans-serif;
            font-size: 12px;
            letter-spacing: 2px;
            opacity: 0.7;
        }

        /* EMPTY */

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;

            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.45;
        }

        /* MOBILE */

        @media (max-width: 500px) {

            header {
                padding-top: 22px;
            }

            .logo {
                font-size: 27px;
                letter-spacing: 6px;
            }

            .catalog-title {
                font-size: 10px;
                letter-spacing: 4px;
            }

            .catalog {
                padding-left: 8px;
                padding-right: 8px;
                gap: 10px;
            }

            .brand {
                font-size: 9px;
                letter-spacing: 3px;
            }

            .price {
                font-size: 10px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">IXwear</div>
    <div class="catalog-title">Collection</div>
</header>


<main class="catalog" id="catalog">

    <!--
        ПРИМЕР ТОВАРА

        Чтобы добавить свой товар,
        скопируй весь блок .product-card
    -->

    <div class="product-card">

        <div class="product">

            <!-- ФОТО ТОВАРА -->
            <img
                class="product-photo"
                src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=800&q=80"
                alt="IXwear product"
            >

            <!-- ТВОЯ РАМКА -->
            <img
                class="frame"
                src="https://img.magnific.com/free-psd/ornate-white-picture-frame-elegant-design-baroque-style-home-decor-blank-template_632498-29751.jpg?semt=ais_hybrid"
                alt=""
            >

            <!-- IXwear -->
            <div class="brand">IXwear</div>

        </div>

        <div class="price">
            $120
        </div>

    </div>


    <!-- ВТОРОЙ ТОВАР -->

    <div class="product-card">

        <div class="product">

            <img
                class="product-photo"
                src="https://images.unsplash.com/photo-1503341504253-dff4815485f1?auto=format&fit=crop&w=800&q=80"
                alt="IXwear product"
            >

            <img
                class="frame"
                src="https://img.magnific.com/free-psd/ornate-white-picture-frame-elegant-design-baroque-style-home-decor-blank-template_632498-29751.jpg?semt=ais_hybrid"
                alt=""
            >

            <div class="brand">IXwear</div>

        </div>

        <div class="price">
            $150
        </div>

    </div>

</main>


<script>
    // Telegram Mini App
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    // Подстраиваем фон под тему Telegram
    if (tg.colorScheme === "dark") {
        document.body.style.background = "#111111";
        document.body.style.color = "#eeeeee";
    }
</script>

</body>
</html>
