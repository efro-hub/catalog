<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>IXwear</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap"
rel="stylesheet"
>

<style>

/* =========================================================
   BASE
   ========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;

    background: #090909;
    color: #fff;
}

body {
    overflow-x: hidden;
    font-family: "Cormorant Garamond", serif;
}


/* =========================================================
   HEADER
   ========================================================= */

.header {
    width: 100%;
    height: 95px;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            ellipse at center,
            #191919 0%,
            #0d0d0d 55%,
            #080808 100%
        );

    border-bottom: 1px solid #222;

    border-radius:
        0 0 25px 25px;
}

.logo {
    display: flex;
    align-items: baseline;

    line-height: 1;

    text-shadow:
        0 2px 10px rgba(0,0,0,.9);
}

.logo-ix {
    font-family: "Cinzel", serif;

    font-size: 42px;
    font-weight: 600;

    letter-spacing: -2px;

    color: #f3f3f3;
}

.logo-wear {
    margin-left: 5px;

    font-family: "Cormorant Garamond", serif;

    font-size: 30px;
    font-weight: 500;

    letter-spacing: 1px;

    color: #bdbdbd;
}


/* =========================================================
   MAIN
   ========================================================= */

main {
    width: 100%;
    max-width: 1100px;

    margin: 0 auto;

    padding:
        35px 30px 80px;
}


/* =========================================================
   TITLE
   ========================================================= */

.catalog-title {
    text-align: center;
    margin-bottom: 55px;
}

.title-line {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
}

.title-decoration {
    width: 65px;
    height: 20px;
    position: relative;
}

.title-decoration::before {
    content: "❧";

    position: absolute;

    left: 0;
    top: -8px;

    font-size: 24px;

    color: #737373;

    transform: rotate(180deg);
}

.title-decoration::after {
    content: "◇";

    position: absolute;

    right: 0;
    top: -5px;

    font-size: 14px;

    color: #555;
}

.title-decoration.right {
    transform: scaleX(-1);
}

.catalog-title h1 {
    margin: 0;

    font-family: "Cinzel", serif;

    font-size: 29px;
    font-weight: 500;

    letter-spacing: 5px;

    color: #e9e9e9;
}

.catalog-subtitle {
    margin-top: 9px;

    font-size: 21px;

    letter-spacing: 1px;

    color: #999;
}


/* =========================================================
   PRODUCTS
   ========================================================= */

#products {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    column-gap: 55px;
    row-gap: 80px;
}

.product {
    min-width: 0;

    text-align: center;

    animation:
        productAppear .6s ease both;
}

@keyframes productAppear {

    from {
        opacity: 0;
        transform:
            translateY(20px)
            scale(.97);
    }

    to {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================================================
   ART FRAME
   ========================================================= */

.frame {
    position: relative;

    width: 100%;

    aspect-ratio: .73 / 1;

    background: #050505;

    isolation: isolate;

    overflow: visible;

    /*
       Главное отличие:
       это НЕ прямоугольная border-рамка.
       Создаём сложный силуэт через несколько слоёв.
    */

    filter:
        drop-shadow(0 18px 18px rgba(0,0,0,.65));
}


/* =========================================================
   MASSIVE OUTER BAROQUE SHAPE
   ========================================================= */

.frame::before {

    content: "";

    position: absolute;

    z-index: -4;

    inset: -22px;

    background:

        /* верхняя корона */
        radial-gradient(
            ellipse at 50% 0%,
            #ffffff 0%,
            #e5e5e5 12%,
            transparent 25%
        ),

        /* левая верхняя лепнина */
        radial-gradient(
            ellipse at 0% 10%,
            #ffffff 0%,
            #bdbdbd 17%,
            transparent 30%
        ),

        /* правая верхняя */
        radial-gradient(
            ellipse at 100% 10%,
            #ffffff 0%,
            #bdbdbd 17%,
            transparent 30%
        ),

        /* нижняя лепнина */
        radial-gradient(
            ellipse at 50% 100%,
            #eeeeee 0%,
            #aaa 15%,
            transparent 29%
        ),

        /* основное тело */
        linear-gradient(
            135deg,
            #777 0%,
            #ffffff 8%,
            #d4d4d4 18%,
            #fafafa 31%,
            #b5b5b5 45%,
            #ffffff 58%,
            #c4c4c4 70%,
            #ffffff 84%,
            #777 100%
        );

    clip-path: polygon(

        13% 3%,
        23% 5%,
        30% 1%,
        38% 5%,
        50% 0%,
        62% 5%,
        70% 1%,
        77% 5%,
        87% 3%,

        94% 12%,
        98% 20%,
        94% 28%,

        98% 38%,
        95% 50%,
        98% 62%,

        94% 72%,
        98% 82%,
        90% 89%,

        82% 95%,
        72% 92%,
        63% 98%,
        50% 94%,
        38% 98%,
        28% 92%,
        18% 95%,
        10% 89%,

        2% 82%,
        6% 72%,
        2% 62%,

        5% 50%,
        2% 38%,
        6% 28%,

        2% 20%,
        6% 12%
    );

    box-shadow:
        0 0 0 4px #444,
        inset 0 0 20px rgba(0,0,0,.45);
}


/* =========================================================
   INNER DARK SHADOW
   ========================================================= */

.frame::after {

    content: "";

    position: absolute;

    z-index: -3;

    inset: -8px;

    background:
        linear-gradient(
            145deg,
            #333,
            #eeeeee 13%,
            #777 25%,
            #f8f8f8 40%,
            #666 55%,
            #eeeeee 70%,
            #444 87%,
            #d8d8d8
        );

    clip-path: polygon(

        10% 4%,
        25% 7%,
        37% 3%,
        50% 6%,
        63% 3%,
        75% 7%,
        90% 4%,

        95% 20%,
        92% 35%,
        96% 50%,
        92% 65%,
        95% 80%,

        88% 94%,
        73% 91%,
        62% 96%,
        50% 92%,
        38% 96%,
        27% 91%,
        12% 94%,

        5% 80%,
        8% 65%,
        4% 50%,
        8% 35%,
        5% 20%
    );

    box-shadow:
        inset 0 0 15px rgba(0,0,0,.8);
}


/* =========================================================
   PHOTO WINDOW
   ========================================================= */

.image-area {

    position: absolute;

    top: 8%;
    left: 9%;
    right: 9%;
    bottom: 9%;

    z-index: 2;

    background:
        radial-gradient(
            ellipse at center,
            #161616 0%,
            #080808 62%,
            #020202 100%
        );

    overflow: hidden;

    /*
       Фото тоже получает слегка художественный силуэт.
    */

    clip-path: polygon(

        3% 4%,
        15% 2%,
        27% 4%,
        40% 2%,
        50% 4%,
        60% 2%,
        73% 4%,
        85% 2%,
        97% 4%,

        98% 20%,
        96% 35%,
        98% 50%,
        96% 65%,
        98% 80%,

        97% 96%,
        85% 98%,
        73% 96%,
        60% 98%,
        50% 96%,
        40% 98%,
        27% 96%,
        15% 98%,
        3% 96%,

        2% 80%,
        4% 65%,
        2% 50%,
        4% 35%,
        2% 20%
    );

    box-shadow:
        inset 0 0 0 2px rgba(255,255,255,.2),
        inset 0 0 25px rgba(0,0,0,.8);
}

.image-area::after {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    box-shadow:
        inset 0 0 25px rgba(0,0,0,.8),
        inset 0 0 0 2px rgba(255,255,255,.2);
}

.product img {

    width: 100%;
    height: 100%;

    object-fit: contain;

    display: block;

    position: relative;

    z-index: 2;
}


/* =========================================================
   BAROQUE DECORATIVE ELEMENTS
   ========================================================= */

.art {

    position: absolute;

    z-index: 15;

    pointer-events: none;
}


/* =========================================================
   TOP CROWN
   ========================================================= */

.crown {

    position: absolute;

    width: 125px;
    height: 75px;

    top: -40px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 20;

    pointer-events: none;
}

.crown::before {

    content: "❦";

    position: absolute;

    left: 50%;
    top: -8px;

    transform:
        translateX(-50%)
        scaleX(1.5);

    font-family: Georgia, serif;

    font-size: 65px;

    color: #eeeeee;

    text-shadow:
        1px 2px 2px #777,
        -1px -1px 1px #fff,
        0 5px 8px rgba(0,0,0,.7);
}

.crown::after {

    content: "◆";

    position: absolute;

    left: 50%;
    bottom: -2px;

    transform: translateX(-50%);

    font-size: 20px;

    color: #999;

    text-shadow:
        0 2px 2px #444;
}


/* =========================================================
   CORNER FLOWERS
   ========================================================= */

.flower {

    position: absolute;

    width: 82px;
    height: 82px;

    z-index: 30;

    pointer-events: none;
}


/* flower center */

.flower::after {

    content: "";

    position: absolute;

    width: 25px;
    height: 25px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%,-50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #fff 0 18%,
            #cfcfcf 20% 42%,
            #777 44% 62%,
            #eee 64% 78%,
            #666 80%
        );

    box-shadow:
        0 3px 7px rgba(0,0,0,.8);
}


/* petals */

.flower span {

    position: absolute;

    width: 28px;
    height: 42px;

    left: 27px;
    top: 0;

    border-radius:
        70% 30% 70% 30%;

    background:
        linear-gradient(
            90deg,
            #777,
            #fff 28%,
            #c7c7c7 50%,
            #fff 70%,
            #777
        );

    box-shadow:
        0 3px 5px rgba(0,0,0,.7);
}

.flower span:nth-child(2) {
    transform: rotate(90deg);
    top: 20px;
    left: 40px;
}

.flower span:nth-child(3) {
    transform: rotate(180deg);
    top: 40px;
}

.flower span:nth-child(4) {
    transform: rotate(270deg);
    top: 20px;
    left: 5px;
}


/* =========================================================
   FLOWER POSITIONS
   ========================================================= */

.flower.tl {
    top: -31px;
    left: -31px;
}

.flower.tr {
    top: -31px;
    right: -31px;
    transform: scaleX(-1);
}

.flower.bl {
    bottom: -31px;
    left: -31px;
    transform: scaleY(-1);
}

.flower.br {
    bottom: -31px;
    right: -31px;
    transform: scale(-1);
}


/* =========================================================
   SIDE CURLS
   ========================================================= */

.curl {

    position: absolute;

    width: 90px;
    height: 90px;

    z-index: 12;

    pointer-events: none;

    border:
        8px solid #d9d9d9;

    border-left-color: transparent;
    border-bottom-color: transparent;

    border-radius: 50%;

    box-shadow:
        2px 2px 4px rgba(0,0,0,.65),
        inset -1px -1px 2px #888;
}

.curl.left {
    left: -40px;
    top: 37%;

    transform:
        rotate(-45deg);
}

.curl.right {
    right: -40px;
    top: 37%;

    transform:
        rotate(135deg);
}


/* =========================================================
   BOTTOM ORNAMENT
   ========================================================= */

.bottom-ornament {

    position: absolute;

    bottom: -43px;

    left: 50%;

    transform:
        translateX(-50%);

    width: 160px;
    height: 55px;

    z-index: 25;

    pointer-events: none;
}

.bottom-ornament::before {

    content: "❧   ❦   ❧";

    position: absolute;

    width: 100%;

    text-align: center;

    font-family: Georgia, serif;

    font-size: 37px;

    color: #eeeeee;

    text-shadow:
        1px 2px 2px #666,
        0 4px 6px rgba(0,0,0,.7);
}


/* =========================================================
   IXWEAR PLAQUE
   ========================================================= */

.frame-brand {

    position: absolute;

    left: 50%;
    bottom: -30px;

    transform:
        translateX(-50%);

    z-index: 40;

    min-width: 120px;
    height: 35px;

    padding: 0 17px;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            180deg,
            #ffffff,
            #dedede 30%,
            #999 55%,
            #f5f5f5 80%,
            #888
        );

    border:
        1px solid #555;

    box-shadow:
        0 4px 8px rgba(0,0,0,.8);

    color: #111;

    white-space: nowrap;
}

.brand-ix {

    font-family: "Cinzel", serif;

    font-size: 18px;
    font-weight: 700;

    letter-spacing: -1px;
}

.brand-wear {

    margin-left: 3px;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size: 17px;

    font-weight: 600;

    letter-spacing: 1px;
}


/* =========================================================
   PRODUCT INFO
   ========================================================= */

.info {

    padding-top: 52px;

    text-align: center;
}

.name {

    font-size: 24px;

    line-height: 1.15;

    color: #eee;

    font-weight: 500;
}

.price {

    margin-top: 6px;

    font-family: "Cinzel", serif;

    font-size: 21px;

    letter-spacing: 2px;

    color: #fff;
}

.description {

    margin-top: 6px;

    color: #777;

    font-size: 15px;
}


/* =========================================================
   STATES
   ========================================================= */

.loading,
.empty,
.error {

    grid-column: 1 / -1;

    text-align: center;

    padding: 70px 10px;

    font-size: 21px;

    color: #777;
}

.error {
    color: #c77;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

    .header {
        height: 88px;
    }

    .logo-ix {
        font-size: 37px;
    }

    .logo-wear {
        font-size: 27px;
    }

    main {
        padding:
            29px 14px 60px;
    }

    .catalog-title {
        margin-bottom: 48px;
    }

    .catalog-title h1 {
        font-size: 20px;
        letter-spacing: 3px;
    }

    .catalog-subtitle {
        font-size: 18px;
    }

    .title-decoration {
        width: 42px;
    }

    #products {
        column-gap: 25px;
        row-gap: 72px;
    }

    .frame {
        aspect-ratio: .70 / 1;
    }

    .crown {
        transform:
            translateX(-50%)
            scale(.72);
    }

    .flower {
        transform: scale(.72);
    }

    .flower.tr {
        transform:
            scaleX(-1)
            scale(.72);
    }

    .flower.bl {
        transform:
            scaleY(-1)
            scale(.72);
    }

    .flower.br {
        transform:
            scale(-1)
            scale(.72);
    }

    .curl {
        transform:
            scale(.72)
            rotate(-45deg);
    }

    .curl.right {
        transform:
            scale(.72)
            rotate(135deg);
    }

    .image-area {
        top: 9%;
        left: 10%;
        right: 10%;
        bottom: 10%;
    }

    .frame-brand {
        min-width: 90px;
        height: 29px;

        bottom: -21px;

        padding: 0 10px;
    }

    .brand-ix {
        font-size: 14px;
    }

    .brand-wear {
        font-size: 13px;
    }

    .bottom-ornament {
        transform:
            translateX(-50%)
            scale(.7);

        bottom: -38px;
    }

    .info {
        padding-top: 35px;
    }

    .name {
        font-size: 17px;
    }

    .price {
        font-size: 15px;
        letter-spacing: 1px;
    }

    .description {
        font-size: 12px;
    }
}


/* =========================================================
   VERY SMALL PHONES
   ========================================================= */

@media (max-width: 380px) {

    main {
        padding-left: 10px;
        padding-right: 10px;
    }

    #products {
        column-gap: 18px;
    }

    .logo-ix {
        font-size: 34px;
    }

    .logo-wear {
        font-size: 24px;
    }

    .name {
        font-size: 15px;
    }

    .price {
        font-size: 14px;
    }
}

</style>
</head>


<body>


<!-- =======================================================
     HEADER
     ======================================================= -->

<header class="header">

    <div class="logo">
        <span class="logo-ix">IX</span>
        <span class="logo-wear">wear</span>
    </div>

</header>


<main>


<!-- =======================================================
     TITLE
     ======================================================= -->

<section class="catalog-title">

    <div class="title-line">

        <span class="title-decoration"></span>

        <h1>COLLECTION</h1>

        <span class="title-decoration right"></span>

    </div>

    <div class="catalog-subtitle">
        CHOOSE YOUR STYLE
    </div>

</section>


<!-- =======================================================
     PRODUCTS
     ======================================================= -->

<div id="products">

    <div class="loading">
        Loading collection...
    </div>

</div>


</main>


<script>

/* =========================================================
   TELEGRAM
   ========================================================= */

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();


/* =========================================================
   CONTAINER
   ========================================================= */

const container =
    document.getElementById("products");


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        String(text);

    return div.innerHTML;
}


/* =========================================================
   BRAND
   ========================================================= */

function brandHTML() {

    return `
        <span class="brand-ix">IX</span>
        <span class="brand-wear">wear</span>
    `;
}


/* =========================================================
   LOAD PRODUCTS
   ========================================================= */

async function loadProducts() {

    try {

        const cacheBuster =
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2);

        const response =
            await fetch(
                "products.json?cache=" +
                cacheBuster,
                {
                    method: "GET",

                    cache: "no-store",

                    headers: {
                        "Cache-Control":
                            "no-cache",

                        "Pragma":
                            "no-cache"
                    }
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }


        const products =
            await response.json();


        if (!Array.isArray(products)) {

            throw new Error(
                "products.json имеет неправильный формат"
            );
        }


        if (products.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    Collection is empty
                </div>
            `;

            return;
        }


        let html = "";


        products.forEach(
            (product, index) => {

                const name =
                    escapeHtml(
                        product.name || ""
                    );

                const price =
                    escapeHtml(
                        product.price || ""
                    );

                const description =
                    escapeHtml(
                        product.description || ""
                    );


                const imageUrl =
                    product.image
                    ? product.image +
                        (
                            product.image.includes("?")
                            ? "&"
                            : "?"
                        ) +
                        "v=" +
                        Date.now()
                    : "";


                html += `

                <article
                    class="product"
                    style="
                        animation-delay:
                        ${index * .06}s;
                    "
                >

                    <div class="frame">


                        <!-- PHOTO -->

                        <div class="image-area">

                            ${
                                imageUrl
                                ? `
                                    <img
                                        src="${imageUrl}"
                                        alt="${name}"
                                        loading="lazy"
                                        onerror="
                                            this.style.display='none';
                                        "
                                    >
                                `
                                : ""
                            }

                        </div>


                        <!-- TOP CROWN -->

                        <div class="crown"></div>


                        <!-- CORNER FLOWERS -->

                        <div class="flower tl">

                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>

                        </div>


                        <div class="flower tr">

                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>

                        </div>


                        <div class="flower bl">

                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>

                        </div>


                        <div class="flower br">

                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>

                        </div>


                        <!-- SIDE CURLS -->

                        <div class="curl left"></div>

                        <div class="curl right"></div>


                        <!-- BOTTOM ORNAMENT -->

                        <div class="bottom-ornament"></div>


                        <!-- BRAND -->

                        <div class="frame-brand">

                            ${brandHTML()}

                        </div>


                    </div>


                    <!-- PRODUCT INFO -->

                    <div class="info">

                        <div class="name">
                            ${name}
                        </div>

                        <div class="price">
                            ${price}
                        </div>

                        ${
                            description
                            ? `
                                <div class="description">
                                    ${description}
                                </div>
                            `
                            : ""
                        }

                    </div>

                </article>

                `;
            }
        );


        container.innerHTML =
            html;


    } catch (error) {

        console.error(
            "Ошибка загрузки каталога:",
            error
        );


        container.innerHTML = `

            <div class="error">

                Could not load collection.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;
    }
}


/* =========================================================
   START
   ========================================================= */

loadProducts();


/* =========================================================
   AUTO UPDATE
   ========================================================= */

setInterval(
    loadProducts,
