<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>IXwear</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap"
      rel="stylesheet">

<style>

/* =====================================================
   GLOBAL
   ===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;

    background: #080808;
    color: #fff;
}

body {
    overflow-x: hidden;
    font-family: "Cormorant Garamond", serif;
}


/* =====================================================
   HEADER
   ===================================================== */

.header {
    width: 100%;
    height: 92px;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            ellipse at center,
            #171717 0%,
            #0d0d0d 55%,
            #080808 100%
        );

    border-bottom: 1px solid #242424;
    border-radius: 0 0 24px 24px;
}


/* =====================================================
   LOGO
   ===================================================== */

.logo {
    display: flex;
    align-items: baseline;

    white-space: nowrap;
    line-height: 1;

    text-shadow:
        0 2px 8px rgba(0,0,0,.9);
}

.logo-ix {
    font-family: "Cinzel", serif;

    font-size: 40px;
    font-weight: 600;

    letter-spacing: -2px;

    color: #f1f1f1;
}

.logo-wear {
    margin-left: 4px;

    font-family: "Cormorant Garamond", serif;

    font-size: 28px;
    font-weight: 500;

    letter-spacing: 1px;

    color: #bdbdbd;
}


/* =====================================================
   MAIN
   ===================================================== */

main {
    width: 100%;
    max-width: 1100px;

    margin: 0 auto;

    padding: 32px 30px 70px;
}


/* =====================================================
   COLLECTION TITLE
   ===================================================== */

.catalog-title {
    text-align: center;

    margin-bottom: 48px;
}

.title-line {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 18px;
}

.title-decoration {
    width: 68px;
    height: 20px;

    position: relative;
}

.title-decoration::before {
    content: "❧";

    position: absolute;

    left: 0;
    top: -8px;

    font-size: 24px;

    color: #737373;

    transform: rotate(180deg);
}

.title-decoration::after {
    content: "◇";

    position: absolute;

    right: 0;
    top: -5px;

    font-size: 14px;

    color: #555;
}

.title-decoration.right {
    transform: scaleX(-1);
}

.catalog-title h1 {
    margin: 0;

    font-family: "Cinzel", serif;

    font-size: 29px;
    font-weight: 500;

    letter-spacing: 5px;

    color: #e8e8e8;
}

.catalog-subtitle {
    margin-top: 9px;

    font-family: "Cormorant Garamond", serif;

    font-size: 21px;

    letter-spacing: 1px;

    color: #999;
}


/* =====================================================
   PRODUCTS GRID
   ===================================================== */

#products {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    column-gap: 55px;
    row-gap: 70px;
}


/* =====================================================
   PRODUCT
   ===================================================== */

.product {
    min-width: 0;

    text-align: center;

    animation:
        productAppear .55s ease both;
}

@keyframes productAppear {

    from {
        opacity: 0;

        transform:
            translateY(18px);
    }

    to {
        opacity: 1;

        transform:
            translateY(0);
    }
}


/* =====================================================
   FRAME
   ===================================================== */

.frame {
    position: relative;

    width: 100%;

    aspect-ratio: .78 / 1;

    overflow: visible;

    isolation: isolate;
}


/* =====================================================
   PRODUCT PHOTO AREA
   ===================================================== */

.image-area {
    position: absolute;

    top: 11%;
    left: 11%;
    right: 11%;
    bottom: 10%;

    z-index: 1;

    overflow: hidden;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            135deg,
            #111 0%,
            #333 100%
        );

    border: 1px solid #000;

    box-shadow:
        inset 0 0 30px rgba(0,0,0,.8),
        inset 0 0 8px rgba(255,255,255,.08);
}


/* =====================================================
   PRODUCT IMAGE
   ===================================================== */

.product img.product-image {

    width: 100%;
    height: 100%;

    object-fit: contain;

    display: block;

    position: relative;

    z-index: 2;
}


/* =====================================================
   BAROQUE FRAME
   ===================================================== */

.frame::before {

    content: "";

    position: absolute;

    inset: 0;

    z-index: 5;

    pointer-events: none;

    background: #fdfdfd;

    border: 8px solid #e5e4e0;

    border-radius: 2px;

    box-shadow:

        0 0 0 2px #fff,

        0 0 0 4px #dcdbd7,

        inset 0 0 15px rgba(0,0,0,.20),

        inset 0 0 0 4px #e2dfda,

        inset 0 0 0 8px #ffffff,

        inset 0 0 20px rgba(0,0,0,.12),

        0 20px 40px rgba(0,0,0,.7),

        0 8px 15px rgba(0,0,0,.4);
}


/* =====================================================
   INNER FRAME
   ===================================================== */

.frame::after {

    content: "";

    position: absolute;

    top: 6%;
    left: 6%;
    right: 6%;
    bottom: 5%;

    z-index: 6;

    pointer-events: none;

    border: 2px double #b5b3ad;

    box-shadow:

        inset 0 0 8px rgba(0,0,0,.15),

        0 0 0 2px #fff;
}


/* =====================================================
   DECORATIVE CORNERS
   ===================================================== */

.corner {
    position: absolute;

    width: 30px;
    height: 30px;

    z-index: 15;

    pointer-events: none;

    border: 1.5px solid #b5b3ad;
}

.corner::before {
    content: "";

    position: absolute;

    top: 2px;
    left: 2px;
    right: 2px;
    bottom: 2px;

    border: 1px dashed #c2c0b8;
}

.corner-tl {
    top: 3%;
    left: 3%;

    border-right: none;
    border-bottom: none;
}

.corner-tr {
    top: 3%;
    right: 3%;

    border-left: none;
    border-bottom: none;
}

.corner-bl {
    bottom: 3%;
    left: 3%;

    border-right: none;
    border-top: none;
}

.corner-br {
    bottom: 3%;
    right: 3%;

    border-left: none;
    border-top: none;
}


/* =====================================================
   IXWEAR PLAQUE
   ===================================================== */

.frame-brand {

    position: absolute;

    left: 50%;
    bottom: -18px;

    transform:
        translateX(-50%);

    z-index: 20;

    display: flex;

    align-items: baseline;
    justify-content: center;

    white-space: nowrap;

    padding:
        5px 17px 6px;

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            #eeeeee 45%,
            #cfcfcf 100%
        );

    color: #080808;

    border:
        1px solid #999;

    border-radius: 3px;

    box-shadow:
        0 4px 10px rgba(0,0,0,.7);
}

.brand-ix {

    font-family: "Cinzel", serif;

    font-size: 17px;

    font-weight: 700;

    letter-spacing: -1px;
}

.brand-wear {

    margin-left: 3px;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size: 17px;

    font-weight: 600;

    letter-spacing: 1px;
}


/* =====================================================
   PRODUCT INFO
   ===================================================== */

.info {
    padding-top: 34px;

    text-align: center;
}


/* =====================================================
   PRODUCT NAME
   ===================================================== */

.name {

    font-family:
        "Cormorant Garamond",
        serif;

    font-size: 27px;

    line-height: 1.1;

    color: #eee;

    font-weight: 600;

    margin-top: -5px;
}


/* =====================================================
   PRICE
   ===================================================== */

.price {

    margin-top: 7px;

    font-family:
        "Cinzel",
        serif;

    font-size: 17px;

    letter-spacing: 1.5px;

    color: #fff;

    font-weight: 500;

    display: inline-flex;

    align-items: center;

    gap: 7px;
}


/* PRICE: */

.price::before {

    content: "PRICE:";

    font-family:
        "Cormorant Garamond",
        serif;

    font-size: 14px;

    font-weight: 600;

    letter-spacing: 1px;

    color: #bdbdbd;
}


/* =====================================================
   PRICE MARKER
   ===================================================== */

.price-value {

    position: relative;

    display: inline-block;

    padding:
        1px 7px 2px;

    color: #fff;
}


/* Main marker outline */

.price-value::before {

    content: "";

    position: absolute;

    left: -3px;
    right: -3px;

    top: 1px;
    bottom: 0;

    border:
        1px solid
        rgba(255,255,255,.85);

    border-radius:
        48% 42% 50% 45%;

    transform:
        rotate(-1deg)
        skewX(-2deg);

    pointer-events: none;
}


/* Secondary imperfect marker line */

.price-value::after {

    content: "";

    position: absolute;

    left: -2px;
    right: -2px;

    top: 0;
    bottom: 1px;

    border:
        1px solid
        rgba(255,255,255,.28);

    border-radius:
        45% 50% 43% 48%;

    transform:
        rotate(1deg);

    pointer-events: none;
}


/* =====================================================
   DESCRIPTION
   ===================================================== */

.description {

    margin-top: 6px;

    color: #777;

    font-size: 15px;
}


/* =====================================================
   STATES
   ===================================================== */

.loading,
.empty,
.error {

    grid-column:
        1 / -1;

    text-align: center;

    padding:
        70px 10px;

    font-size: 21px;

    color: #777;
}

.error {
    color: #c77;
}


/* =====================================================
   MOBILE
   ===================================================== */

@media (max-width: 600px) {

    .header {

        height: 92px;

        border-radius:
            0 0 22px 22px;
    }


    .logo-ix {
        font-size: 37px;
    }

    .logo-wear {
        font-size: 26px;
    }


    main {

        padding:
            29px 15px 55px;
    }


    .catalog-title {
        margin-bottom: 42px;
    }


    .catalog-title h1 {

        font-size: 20px;

        letter-spacing: 3px;
    }


    .catalog-subtitle {
        font-size: 18px;
    }


    .title-decoration {
        width: 43px;
    }


    #products {

        column-gap: 25px;

        row-gap: 60px;
    }


    /* FRAME */

    .frame::before {

        border-width: 6px;

        box-shadow:

            0 0 0 1px #fff,

            0 0 0 3px #dcdbd7,

            inset 0 0 9px rgba(0,0,0,.2),

            inset 0 0 0 3px #e2dfda,

            inset 0 0 0 5px #ffffff,

            inset 0 0 12px rgba(0,0,0,.12),

            0 10px 20px rgba(0,0,0,.7);
    }


    .frame::after {

        top: 6%;
        left: 6%;
        right: 6%;
        bottom: 5%;

        border-width: 1px;
    }


    .corner {

        width: 20px;
        height: 20px;
    }


    /* BRAND */

    .frame-brand {

        bottom: -14px;

        padding:
            3px 10px 4px;
    }


    .brand-ix {
        font-size: 12px;
    }


    .brand-wear {

        font-size: 12px;

        margin-left: 2px;
    }


    /* INFO */

    .info {
        padding-top: 29px;
    }


    /* NAME */

    .name {

        font-size: 20px;

        margin-top: -4px;
    }


    /* PRICE */

    .price {

        font-size: 14px;

        letter-spacing: 1px;

        gap: 5px;
    }


    .price::before {

        font-size: 11px;

        letter-spacing: .8px;
    }


    .price-value {

        padding:
            1px 5px 2px;
    }


    .description {

        font-size: 12px;
    }
}


/* =====================================================
   VERY SMALL PHONES
   ===================================================== */

@media (max-width: 380px) {

    main {

        padding-left: 11px;
        padding-right: 11px;
    }


    .logo-ix {
        font-size: 34px;
    }


    .logo-wear {
        font-size: 24px;
    }


    #products {

        column-gap: 19px;
    }


    .name {
        font-size: 18px;
    }


    .price {
        font-size: 13px;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     HEADER
     ===================================================== -->

<header class="header">

    <div class="logo">

        <span class="logo-ix">
            IX
        </span>

        <span class="logo-wear">
            wear
        </span>

    </div>

</header>


<!-- =====================================================
     MAIN
     ===================================================== -->

<main>

    <section class="catalog-title">

        <div class="title-line">

            <span class="title-decoration"></span>

            <h1>
                COLLECTION
            </h1>

            <span class="title-decoration right"></span>

        </div>


        <div class="catalog-subtitle">
            CHOOSE YOUR STYLE
        </div>

    </section>


    <div id="products">

        <div class="loading">
            Loading collection...
        </div>

    </div>

</main>


<script>

/* =====================================================
   TELEGRAM
   ===================================================== */

const tg =
    window.Telegram.WebApp;

tg.ready();
tg.expand();


/* =====================================================
   PRODUCTS CONTAINER
   ===================================================== */

const container =
    document.getElementById(
        "products"
    );


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHtml(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        String(text);

    return div.innerHTML;
}


/* =====================================================
   IXWEAR BRAND
   ===================================================== */

function brandHTML() {

    return `

        <span class="brand-ix">
            IX
        </span>

        <span class="brand-wear">
            wear
        </span>

    `;
}


/* =====================================================
   LOAD PRODUCTS
   ===================================================== */

async function loadProducts() {

    try {

        const cacheBuster =
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2);


        const response =
            await fetch(
                "products.json?cache=" +
                cacheBuster,
                {
                    method: "GET",

                    cache: "no-store",

                    headers: {

                        "Cache-Control":
                            "no-cache",

                        "Pragma":
                            "no-cache"
                    }
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }


        const products =
            await response.json();


        if (!Array.isArray(products)) {

            throw new Error(
                "products.json имеет неправильный формат"
            );
        }


        if (products.length === 0) {

            container.innerHTML = `

                <div class="empty">
                    Collection is empty
                </div>

            `;

            return;
        }


        let html = "";


        /* =================================================
           CREATE PRODUCTS
           ================================================= */

        products.forEach(
            (product, index) => {

                const name =
                    escapeHtml(
                        product.name || ""
                    );


                const price =
                    escapeHtml(
                        product.price || ""
                    );


                const description =
                    escapeHtml(
                        product.description || ""
                    );


                const imageUrl =
                    product.image
                        ? product.image +
                          (
                              product.image.includes("?")
                              ? "&"
                              : "?"
                          ) +
                          "v=" +
                          Date.now()
                        : "";


                html += `

                    <article
                        class="product"

                        style="
                            animation-delay:
                            ${index * 0.06}s;
                        "
                    >


                        <!-- ============================
                             FRAME
                             ============================ -->

                        <div class="frame">


                            <!-- PRODUCT IMAGE -->

                            <div class="image-area">

                                ${
                                    imageUrl
                                    ? `

                                        <img
                                            class="product-image"

                                            src="${imageUrl}"

                                            alt="${name}"

                                            loading="lazy"

                                            onerror="
                                                this.style.display='none';
                                            "
                                        >

                                    `
                                    : ""
                                }

                            </div>


                            <!-- CORNERS -->

                            <span
                                class="corner corner-tl">
                            </span>

                            <span
                                class="corner corner-tr">
                            </span>

                            <span
                                class="corner corner-bl">
                            </span>

                            <span
                                class="corner corner-br">
                            </span>


                            <!-- IXWEAR -->

                            <div class="frame-brand">

                                ${brandHTML()}

                            </div>


                        </div>


                        <!-- ============================
                             PRODUCT INFO
                             ============================ -->

                        <div class="info">


                            <!-- NAME -->

                            <div class="name">
                                ${name}
                            </div>


                            <!-- PRICE -->

                            <div class="price">

                                <span class="price-value">
                                    ${price}
                                </span>

                            </div>


                            <!-- DESCRIPTION -->

                            ${
                                description
                                ? `

                                    <div class="description">
                                        ${description}
                                    </div>

                                `
                                : ""
                            }


                        </div>


                    </article>

                `;
            }
        );


        container.innerHTML =
            html;


    } catch (error) {

        console.error(
            "Ошибка загрузки каталога:",
            error
        );


        container.innerHTML = `

            <div class="error">

                Could not load collection.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;
    }
}


/* =====================================================
   START
   ===================================================== */

loadProducts();


/* =====================================================
   AUTO UPDATE
   ===================================================== */

setInterval(
    loadProducts,
    3000
);

</script>

</body>
</html>
