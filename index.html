<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>IXwear</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap"
      rel="stylesheet">

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #080808;
    color: #fff;
}

body {
    overflow-x: hidden;
    font-family: "Cormorant Garamond", serif;
}


/* =====================================================
   HEADER
===================================================== */

.header {
    width: 100%;
    height: 92px;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            ellipse at center,
            #171717 0%,
            #0d0d0d 55%,
            #080808 100%
        );

    border-bottom: 1px solid #242424;
    border-radius: 0 0 24px 24px;
}


/* =====================================================
   LOGO
===================================================== */

.logo {
    display: flex;
    align-items: baseline;
    white-space: nowrap;
    line-height: 1;

    text-shadow:
        0 2px 8px rgba(0,0,0,.9);
}

.logo-ix {
    font-family: "Cinzel", serif;
    font-size: 40px;
    font-weight: 600;
    letter-spacing: -2px;
    color: #f1f1f1;
}

.logo-wear {
    margin-left: 4px;

    font-family: "Cormorant Garamond", serif;
    font-size: 28px;
    font-weight: 500;
    letter-spacing: 1px;

    color: #bdbdbd;
}


/* =====================================================
   MAIN
===================================================== */

main {
    width: 100%;
    max-width: 1100px;

    margin: 0 auto;

    padding: 32px 30px 70px;
}


/* =====================================================
   TITLE
===================================================== */

.catalog-title {
    text-align: center;
    margin-bottom: 48px;
}

.title-line {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
}

.title-decoration {
    width: 68px;
    height: 20px;
    position: relative;
}

.title-decoration::before {
    content: "❧";

    position: absolute;
    left: 0;
    top: -8px;

    font-size: 24px;
    color: #737373;

    transform: rotate(180deg);
}

.title-decoration::after {
    content: "◇";

    position: absolute;
    right: 0;
    top: -5px;

    font-size: 14px;
    color: #555;
}

.title-decoration.right {
    transform: scaleX(-1);
}

.catalog-title h1 {
    margin: 0;

    font-family: "Cinzel", serif;
    font-size: 29px;
    font-weight: 500;

    letter-spacing: 5px;

    color: #e8e8e8;
}

.catalog-subtitle {
    margin-top: 9px;

    font-size: 21px;
    letter-spacing: 1px;

    color: #999;
}


/* =====================================================
   PRODUCTS
===================================================== */

#products {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    column-gap: 55px;
    row-gap: 70px;
}

.product {
    min-width: 0;
    text-align: center;

    animation:
        productAppear .55s ease both;
}

@keyframes productAppear {

    from {
        opacity: 0;
        transform: translateY(18px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =====================================================
   FRAME
===================================================== */

.frame {
    position: relative;

    width: 100%;

    aspect-ratio: .78 / 1;

    overflow: visible;

    isolation: isolate;

    /*
       ОСНОВНОЙ БЕЛЫЙ БАГЕТ
    */

    background:
        linear-gradient(
            135deg,
            #ffffff 0%,
            #eeeeeb 16%,
            #d5d4cf 30%,
            #fafaf8 44%,
            #c9c8c3 62%,
            #f7f7f5 78%,
            #d2d1cc 100%
        );

    border: 7px solid #e2e1dc;

    box-shadow:

        /* наружный кант */
        0 0 0 2px #ffffff,

        0 0 0 5px #c9c8c3,

        0 0 0 8px #f7f7f5,

        0 0 0 11px #aaa9a4,

        /* объем */
        inset 0 0 0 3px #ffffff,

        inset 0 0 0 6px #c4c3be,

        inset 0 0 0 9px #f5f5f3,

        inset 0 0 16px rgba(0,0,0,.45),

        /* внешняя тень */
        0 12px 25px rgba(0,0,0,.8);
}


/* =====================================================
   ВНУТРЕННИЙ БАГЕТ
===================================================== */

.frame-inner {
    position: absolute;

    top: 10%;
    left: 10%;
    right: 10%;
    bottom: 10%;

    background:
        linear-gradient(
            145deg,
            #eeeeeb,
            #bdbcb7 35%,
            #f5f5f3 52%,
            #b8b7b2 78%,
            #eeeeeb
        );

    border:
        5px solid #d7d6d1;

    box-shadow:

        inset
        0 0 0 2px #ffffff,

        inset
        0 0 0 5px #aaa9a4,

        inset
        0 0 0 8px #f7f7f5,

        inset
        0 0 18px rgba(0,0,0,.4);

    padding: 8px;

    z-index: 2;
}


/* =====================================================
   ВНУТРЕННЯЯ ТОНКАЯ ЛИНИЯ
===================================================== */

.frame-inner::before {
    content: "";

    position: absolute;

    inset: 4px;

    border:
        2px solid #8f8e89;

    box-shadow:
        inset 0 0 0 2px #f7f7f5;

    pointer-events: none;

    z-index: 5;
}


/* =====================================================
   ОКНО ДЛЯ ТОВАРА
===================================================== */

.image-area {

    position: absolute;

    top: 12%;
    left: 12%;
    right: 12%;
    bottom: 12%;

    z-index: 1;

    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            ellipse at center,
            #191919 0%,
            #0b0b0b 65%,
            #020202 100%
        );

    border:
        1px solid #000;

    box-shadow:

        inset
        0 0 20px rgba(0,0,0,.95),

        inset
        0 0 3px rgba(255,255,255,.2);
}


/* =====================================================
   PHOTO
===================================================== */

.product img.product-image {

    width: 100%;
    height: 100%;

    object-fit: contain;

    display: block;

    position: relative;

    z-index: 2;
}


/* =====================================================
   ДЕКОРАТИВНЫЕ УГОЛКИ
===================================================== */

.corner {
    position: absolute;

    z-index: 10;

    width: 48px;
    height: 48px;

    pointer-events: none;
}


/* =====================================================
   УГОЛКОВЫЕ ЛИНИИ
===================================================== */

.corner::before {
    content: "";

    position: absolute;

    width: 32px;
    height: 32px;

    border:
        3px solid #aaa9a4;

    box-shadow:
        0 0 0 1px #ffffff;

    transform: rotate(45deg);
}

.corner::after {
    content: "";

    position: absolute;

    width: 18px;
    height: 18px;

    border:
        2px solid #c5c4bf;

    transform: rotate(45deg);
}


/* TOP LEFT */

.corner-tl {
    top: -7px;
    left: -7px;
}

.corner-tl::before {
    top: 5px;
    left: 5px;

    border-right: none;
    border-bottom: none;
}

.corner-tl::after {
    top: 12px;
    left: 12px;

    border-right: none;
    border-bottom: none;
}


/* TOP RIGHT */

.corner-tr {
    top: -7px;
    right: -7px;

    transform: scaleX(-1);
}


/* BOTTOM LEFT */

.corner-bl {
    bottom: -7px;
    left: -7px;

    transform: scaleY(-1);
}


/* BOTTOM RIGHT */

.corner-br {
    bottom: -7px;
    right: -7px;

    transform: scale(-1);
}


/* =====================================================
   IXWEAR НА РАМКЕ
===================================================== */

.frame-brand {

    position: absolute;

    left: 50%;
    top: 4px;

    transform:
        translateX(-50%);

    z-index: 20;

    font-family:
        "Cinzel",
        serif;

    font-size: 12px;

    font-weight: 600;

    letter-spacing: 3px;

    color: #96948e;

    text-shadow:
        1px 1px 0 #fff,
        -1px -1px 1px rgba(0,0,0,.2);

    white-space: nowrap;
}


/* =====================================================
   НИЖНИЙ ОРНАМЕНТ
===================================================== */

.frame-ornament {

    position: absolute;

    left: 50%;
    bottom: 3px;

    transform:
        translateX(-50%);

    z-index: 20;

    font-size: 9px;

    letter-spacing: 4px;

    color: #aaa9a4;

    text-shadow:
        1px 1px 0 #fff;

    white-space: nowrap;
}


/* =====================================================
   PRODUCT INFO
===================================================== */

.info {
    padding-top: 35px;

    text-align: center;
}

.name {
    font-family:
        "Cormorant Garamond",
        serif;

    font-size: 24px;

    line-height: 1.15;

    color: #eee;

    font-weight: 500;
}

.price {
    margin-top: 6px;

    font-family:
        "Cinzel",
        serif;

    font-size: 21px;

    letter-spacing: 2px;

    color: #fff;

    font-weight: 500;
}

.description {
    margin-top: 6px;

    color: #777;

    font-size: 15px;
}


/* =====================================================
   STATES
===================================================== */

.loading,
.empty,
.error {

    grid-column: 1 / -1;

    text-align: center;

    padding: 70px 10px;

    font-size: 21px;

    color: #777;
}

.error {
    color: #c77;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .header {
        height: 92px;

        border-radius:
            0 0 22px 22px;
    }

    .logo-ix {
        font-size: 37px;
    }

    .logo-wear {
        font-size: 26px;
    }

    main {
        padding:
            29px 15px 55px;
    }

    .catalog-title {
        margin-bottom: 42px;
    }

    .catalog-title h1 {
        font-size: 20px;

        letter-spacing: 3px;
    }

    .catalog-subtitle {
        font-size: 18px;
    }

    .title-decoration {
        width: 43px;
    }

    #products {
        column-gap: 25px;
        row-gap: 60px;
    }


    /* MOBILE FRAME */

    .frame {

        border-width: 5px;

        box-shadow:

            0 0 0 2px #ffffff,

            0 0 0 4px #c9c8c3,

            0 0 0 6px #f7f7f5,

            0 0 0 8px #aaa9a4,

            inset 0 0 0 2px #ffffff,

            inset 0 0 0 4px #c4c3be,

            inset 0 0 0 6px #f5f5f3,

            inset 0 0 12px rgba(0,0,0,.45),

            0 8px 18px rgba(0,0,0,.8);
    }


    .frame-inner {

        top: 10%;
        left: 10%;
        right: 10%;
        bottom: 10%;

        border-width: 4px;

        padding: 6px;
    }


    .frame-inner::before {
        inset: 3px;

        border-width: 1px;
    }


    .image-area {

        top: 12%;
        left: 12%;
        right: 12%;
        bottom: 12%;
    }


    .corner {
        width: 32px;
        height: 32px;
    }

    .corner::before {
        width: 22px;
        height: 22px;

        border-width: 2px;
    }

    .corner::after {
        width: 12px;
        height: 12px;

        border-width: 1px;
    }


    .corner-tl {
        top: -5px;
        left: -5px;
    }

    .corner-tr {
        top: -5px;
        right: -5px;
    }

    .corner-bl {
        bottom: -5px;
        left: -5px;
    }

    .corner-br {
        bottom: -5px;
        right: -5px;
    }


    .frame-brand {

        top: 2px;

        font-size: 7px;

        letter-spacing: 2px;
    }


    .frame-ornament {

        bottom: 1px;

        font-size: 6px;

        letter-spacing: 2px;
    }


    .info {
        padding-top: 29px;
    }

    .name {
        font-size: 17px;
    }

    .price {
        font-size: 15px;

        letter-spacing: 1px;
    }

    .description {
        font-size: 12px;
    }
}


/* =====================================================
   VERY SMALL PHONES
===================================================== */

@media (max-width: 380px) {

    main {
        padding-left: 11px;
        padding-right: 11px;
    }

    .logo-ix {
        font-size: 34px;
    }

    .logo-wear {
        font-size: 24px;
    }

    #products {
        column-gap: 19px;
    }

    .name {
        font-size: 15px;
    }

    .price {
        font-size: 14px;
    }
}

</style>
</head>


<body>


<header class="header">

    <div class="logo">

        <span class="logo-ix">
            IX
        </span>

        <span class="logo-wear">
            wear
        </span>

    </div>

</header>


<main>

    <section class="catalog-title">

        <div class="title-line">

            <span class="title-decoration"></span>

            <h1>
                COLLECTION
            </h1>

            <span class="title-decoration right"></span>

        </div>

        <div class="catalog-subtitle">
            CHOOSE YOUR STYLE
        </div>

    </section>


    <div id="products">

        <div class="loading">
            Loading collection...
        </div>

    </div>

</main>


<script>

const tg =
    window.Telegram.WebApp;

tg.ready();
tg.expand();


const container =
    document.getElementById("products");


function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        String(text);

    return div.innerHTML;
}


async function loadProducts() {

    try {

        const cacheBuster =
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2);


        const response =
            await fetch(
                "products.json?cache=" +
                cacheBuster,
                {
                    method: "GET",

                    cache: "no-store",

                    headers: {
                        "Cache-Control":
                            "no-cache",

                        "Pragma":
                            "no-cache"
                    }
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }


        const products =
            await response.json();


        if (!Array.isArray(products)) {

            throw new Error(
                "products.json имеет неправильный формат"
            );
        }


        if (products.length === 0) {

            container.innerHTML = `

                <div class="empty">
                    Collection is empty
                </div>

            `;

            return;
        }


        let html = "";


        products.forEach(
            (product, index) => {

                const name =
                    escapeHtml(
                        product.name || ""
                    );


                const price =
                    escapeHtml(
                        product.price || ""
                    );


                const description =
                    escapeHtml(
                        product.description || ""
                    );


                const imageUrl =
                    product.image
                        ? product.image +
                          (
                              product.image.includes("?")
                              ? "&"
                              : "?"
                          ) +
                          "v=" +
                          Date.now()
                        : "";


                html += `

                    <article
                        class="product"
                        style="
                            animation-delay:
                            ${index * 0.06}s;
                        "
                    >

                        <div class="frame">


                            <!-- INNER FRAME -->

                            <div class="frame-inner">


                                <!-- PRODUCT PHOTO -->

                                <div class="image-area">

                                    ${
                                        imageUrl
                                        ? `

                                            <img
                                                class="product-image"

                                                src="${imageUrl}"

                                                alt="${name}"

                                                loading="lazy"

                                                onerror="
                                                    this.style.display='none';
                                                "
                                            >

                                        `
                                        : ""
                                    }

                                </div>

                            </div>


                            <!-- CORNERS -->

                            <span class="corner corner-tl"></span>

                            <span class="corner corner-tr"></span>

                            <span class="corner corner-bl"></span>

                            <span class="corner corner-br"></span>


                            <!-- FRAME BRAND -->

                            <div class="frame-brand">
                                IXwear
                            </div>


                            <!-- BOTTOM DECOR -->

                            <div class="frame-ornament">
                                ❖ ❖ ❖
                            </div>


                        </div>


                        <!-- PRODUCT INFO -->

                        <div class="info">

                            <div class="name">
                                ${name}
                            </div>


                            <div class="price">
                                ${price}
                            </div>


                            ${
                                description
                                ? `

                                    <div class="description">
                                        ${description}
                                    </div>

                                `
                                : ""
                            }

                        </div>


                    </article>

                `;
            }
        );


        container.innerHTML =
            html;


    } catch (error) {

        console.error(
            "Ошибка загрузки каталога:",
            error
        );


        container.innerHTML = `

            <div class="error">

                Could not load collection.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;
    }
}


loadProducts();


setInterval(
    loadProducts,
    3000
);

</script>

</body>
</html>
