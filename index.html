<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>IXwear</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap"
      rel="stylesheet">

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;

    background: #080808;
    color: #fff;
}

body {
    overflow-x: hidden;
    font-family: "Cormorant Garamond", serif;
}


/* =====================================================
   HEADER
   ===================================================== */

.header {
    width: 100%;
    height: 92px;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            ellipse at center,
            #171717 0%,
            #0d0d0d 55%,
            #080808 100%
        );

    border-bottom: 1px solid #242424;
    border-radius: 0 0 24px 24px;
}


/* =====================================================
   LOGO
   ===================================================== */

.logo {
    display: flex;
    align-items: baseline;
    white-space: nowrap;
    line-height: 1;

    text-shadow:
        0 2px 8px rgba(0,0,0,.9);
}

.logo-ix {
    font-family: "Cinzel", serif;
    font-size: 40px;
    font-weight: 600;
    letter-spacing: -2px;
    color: #f1f1f1;
}

.logo-wear {
    margin-left: 4px;

    font-family: "Cormorant Garamond", serif;
    font-size: 28px;
    font-weight: 500;
    letter-spacing: 1px;

    color: #bdbdbd;
}


/* =====================================================
   MAIN
   ===================================================== */

main {
    width: 100%;
    max-width: 1100px;

    margin: 0 auto;

    padding: 32px 30px 70px;
}


/* =====================================================
   TITLE
   ===================================================== */

.catalog-title {
    text-align: center;
    margin-bottom: 48px;
}

.title-line {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
}

.title-decoration {
    width: 68px;
    height: 20px;
    position: relative;
}

.title-decoration::before {
    content: "❧";

    position: absolute;
    left: 0;
    top: -8px;

    font-size: 24px;
    color: #737373;

    transform: rotate(180deg);
}

.title-decoration::after {
    content: "◇";

    position: absolute;
    right: 0;
    top: -5px;

    font-size: 14px;
    color: #555;
}

.title-decoration.right {
    transform: scaleX(-1);
}

.catalog-title h1 {
    margin: 0;

    font-family: "Cinzel", serif;
    font-size: 29px;
    font-weight: 500;

    letter-spacing: 5px;

    color: #e8e8e8;
}

.catalog-subtitle {
    margin-top: 9px;

    font-size: 21px;
    letter-spacing: 1px;

    color: #999;
}


/* =====================================================
   PRODUCTS
   ===================================================== */

#products {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    column-gap: 55px;
    row-gap: 70px;
}

.product {
    min-width: 0;
    text-align: center;

    animation:
        productAppear .55s ease both;
}

@keyframes productAppear {

    from {
        opacity: 0;
        transform: translateY(18px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =====================================================
   ART FRAME
   ===================================================== */

.frame {
    position: relative;

    width: 100%;

    aspect-ratio: .78 / 1;

    overflow: visible;

    isolation: isolate;
}


/* =====================================================
   REAL PRODUCT WINDOW
   ===================================================== */

.image-area {

    position: absolute;

    /*
       ЭТО РАЗМЕР ОТВЕРСТИЯ
    */

    top: 13%;
    left: 13%;
    right: 13%;
    bottom: 12%;

    z-index: 1;

    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            ellipse at center,
            #191919 0%,
            #0b0b0b 65%,
            #020202 100%
        );

    /*
       ВНУТРЕННЯЯ ТЕНЬ
    */

    box-shadow:
        inset 0 0 18px rgba(0,0,0,.95),
        inset 0 0 4px rgba(255,255,255,.15);
}


/* =====================================================
   PRODUCT PHOTO
   ===================================================== */

.product img.product-image {

    width: 100%;
    height: 100%;

    object-fit: contain;

    display: block;

    position: relative;

    z-index: 2;
}


/* =====================================================
   DECORATIVE FRAME
   ===================================================== */

.frame::before {

    content: "";

    position: absolute;

    inset: 0;

    z-index: 5;

    pointer-events: none;

    /*
       ОСНОВНАЯ ШИРОКАЯ РАМКА
    */

    border: 15px solid #d8d8d8;

    /*
       СЛОЖНЫЙ СТАРИННЫЙ ОБЪЕМ
    */

    box-shadow:

        inset 0 0 0 2px #777,

        inset 0 0 0 5px #f4f4f4,

        inset 0 0 0 8px #a4a4a4,

        inset 0 0 0 11px #eeeeee,

        inset 0 0 20px rgba(0,0,0,.65),

        0 7px 15px rgba(0,0,0,.65);

}


/* =====================================================
   INNER FRAME LINE
   ===================================================== */

.frame::after {

    content: "";

    position: absolute;

    top: 10%;
    left: 10%;
    right: 10%;
    bottom: 9%;

    z-index: 6;

    pointer-events: none;

    border: 2px solid #777;

    box-shadow:

        inset 0 0 0 2px #eeeeee,

        inset 0 0 8px rgba(0,0,0,.75),

        0 0 0 2px rgba(255,255,255,.08);

}


/* =====================================================
   ORNAMENT CORNERS
   ===================================================== */

.frame-brand {

    position: absolute;

    left: 50%;
    bottom: -18px;

    transform: translateX(-50%);

    z-index: 20;

    display: flex;

    align-items: baseline;
    justify-content: center;

    white-space: nowrap;

    padding: 5px 17px 6px;

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            #eeeeee 45%,
            #cfcfcf 100%
        );

    color: #080808;

    border: 1px solid #999;

    border-radius: 3px;

    box-shadow:
        0 4px 10px rgba(0,0,0,.7);
}


/* =====================================================
   DECORATIVE CORNER DETAILS
   ===================================================== */

.frame > .corner {
    position: absolute;

    z-index: 15;

    width: 45px;
    height: 45px;

    pointer-events: none;
}

.corner::before,
.corner::after {
    content: "";

    position: absolute;

    border-color: #d9d9d9;
    border-style: solid;
}

.corner-tl {
    top: -3px;
    left: -3px;
}

.corner-tr {
    top: -3px;
    right: -3px;
    transform: scaleX(-1);
}

.corner-bl {
    bottom: -3px;
    left: -3px;
    transform: scaleY(-1);
}

.corner-br {
    bottom: -3px;
    right: -3px;
    transform: scale(-1);
}

.corner::before {
    width: 28px;
    height: 28px;

    border-width: 3px 0 0 3px;

    transform: rotate(45deg);

    top: 7px;
    left: 7px;

    box-shadow:
        0 0 3px rgba(255,255,255,.45);
}

.corner::after {
    width: 17px;
    height: 17px;

    border-width: 0 3px 3px 0;

    transform: rotate(45deg);

    top: 11px;
    left: 11px;
}


/* =====================================================
   BRAND
   ===================================================== */

.brand-ix {
    font-family: "Cinzel", serif;

    font-size: 17px;
    font-weight: 700;

    letter-spacing: -1px;
}

.brand-wear {
    margin-left: 3px;

    font-family: "Cormorant Garamond", serif;

    font-size: 17px;
    font-weight: 600;

    letter-spacing: 1px;
}


/* =====================================================
   INFO
   ===================================================== */

.info {
    padding-top: 35px;
    text-align: center;
}

.name {
    font-family: "Cormorant Garamond", serif;

    font-size: 24px;
    line-height: 1.15;

    color: #eee;
    font-weight: 500;
}

.price {
    margin-top: 6px;

    font-family: "Cinzel", serif;

    font-size: 21px;
    letter-spacing: 2px;

    color: #fff;
    font-weight: 500;
}

.description {
    margin-top: 6px;

    color: #777;

    font-size: 15px;
}


/* =====================================================
   STATES
   ===================================================== */

.loading,
.empty,
.error {

    grid-column: 1 / -1;

    text-align: center;

    padding: 70px 10px;

    font-size: 21px;

    color: #777;
}

.error {
    color: #c77;
}


/* =====================================================
   MOBILE
   ===================================================== */

@media (max-width: 600px) {

    .header {
        height: 92px;
        border-radius: 0 0 22px 22px;
    }

    .logo-ix {
        font-size: 37px;
    }

    .logo-wear {
        font-size: 26px;
    }

    main {
        padding: 29px 15px 55px;
    }

    .catalog-title {
        margin-bottom: 42px;
    }

    .catalog-title h1 {
        font-size: 20px;
        letter-spacing: 3px;
    }

    .catalog-subtitle {
        font-size: 18px;
    }

    .title-decoration {
        width: 43px;
    }

    #products {
        column-gap: 25px;
        row-gap: 60px;
    }

    .frame::before {
        border-width: 10px;

        box-shadow:
            inset 0 0 0 2px #777,
            inset 0 0 0 4px #f4f4f4,
            inset 0 0 0 6px #a4a4a4,
            inset 0 0 0 8px #eeeeee,
            inset 0 0 14px rgba(0,0,0,.7),
            0 5px 9px rgba(0,0,0,.65);
    }

    .frame::after {
        top: 10%;
        left: 10%;
        right: 10%;
        bottom: 9%;
    }

    .corner {
        transform: scale(.7);
    }

    .corner-tr {
        transform: scaleX(-1) scale(.7);
    }

    .corner-bl {
        transform: scaleY(-1) scale(.7);
    }

    .corner-br {
        transform: scale(-1) scale(.7);
    }

    .frame-brand {
        bottom: -14px;

        padding:
            3px 10px 4px;
    }

    .brand-ix {
        font-size: 12px;
    }

    .brand-wear {
        font-size: 12px;
        margin-left: 2px;
    }

    .info {
        padding-top: 29px;
    }

    .name {
        font-size: 17px;
    }

    .price {
        font-size: 15px;
        letter-spacing: 1px;
    }

    .description {
        font-size: 12px;
    }
}


@media (max-width: 380px) {

    main {
        padding-left: 11px;
        padding-right: 11px;
    }

    .logo-ix {
        font-size: 34px;
    }

    .logo-wear {
        font-size: 24px;
    }

    #products {
        column-gap: 19px;
    }

    .name {
        font-size: 15px;
    }

    .price {
        font-size: 14px;
    }
}

</style>
</head>


<body>


<header class="header">

    <div class="logo">

        <span class="logo-ix">
            IX
        </span>

        <span class="logo-wear">
            wear
        </span>

    </div>

</header>


<main>

    <section class="catalog-title">

        <div class="title-line">

            <span class="title-decoration"></span>

            <h1>
                COLLECTION
            </h1>

            <span class="title-decoration right"></span>

        </div>

        <div class="catalog-subtitle">
            CHOOSE YOUR STYLE
        </div>

    </section>


    <div id="products">

        <div class="loading">
            Loading collection...
        </div>

    </div>

</main>


<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();


const container =
    document.getElementById("products");


function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        String(text);

    return div.innerHTML;
}


function brandHTML() {

    return `

        <span class="brand-ix">
            IX
        </span>

        <span class="brand-wear">
            wear
        </span>

    `;
}


async function loadProducts() {

    try {

        const cacheBuster =
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2);


        const response =
            await fetch(
                "products.json?cache=" +
                cacheBuster,
                {
                    method: "GET",

                    cache: "no-store",

                    headers: {
                        "Cache-Control":
                            "no-cache",

                        "Pragma":
                            "no-cache"
                    }
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const products =
            await response.json();


        if (!Array.isArray(products)) {

            throw new Error(
                "products.json имеет неправильный формат"
            );

        }


        if (products.length === 0) {

            container.innerHTML = `

                <div class="empty">
                    Collection is empty
                </div>

            `;

            return;
        }


        let html = "";


        products.forEach(
            (product, index) => {

                const name =
                    escapeHtml(
                        product.name || ""
                    );


                const price =
                    escapeHtml(
                        product.price || ""
                    );


                const description =
                    escapeHtml(
                        product.description || ""
                    );


                const imageUrl =
                    product.image
                        ? product.image +
                          (
                              product.image.includes("?")
                              ? "&"
                              : "?"
                          ) +
                          "v=" +
                          Date.now()
                        : "";


                html += `

                    <article
                        class="product"
                        style="
                            animation-delay:
                            ${index * 0.06}s;
                        "
                    >

                        <div class="frame">


                            <div class="image-area">

                                ${
                                    imageUrl
                                    ? `

                                        <img
                                            class="product-image"

                                            src="${imageUrl}"

                                            alt="${name}"

                                            loading="lazy"

                                            onerror="
                                                this.style.display='none';
                                            "
                                        >

                                    `
                                    : ""
                                }

                            </div>


                            <!-- DECORATIVE CORNERS -->

                            <span class="corner corner-tl"></span>

                            <span class="corner corner-tr"></span>

                            <span class="corner corner-bl"></span>

                            <span class="corner corner-br"></span>


                            <!-- IXWEAR -->

                            <div class="frame-brand">

                                ${brandHTML()}

                            </div>


                        </div>


                        <div class="info">

                            <div class="name">
                                ${name}
                            </div>


                            <div class="price">
                                ${price}
                            </div>


                            ${
                                description
                                ? `

                                    <div class="description">
                                        ${description}
                                    </div>

                                `
                                : ""
                            }

                        </div>


                    </article>

                `;
            }
        );


        container.innerHTML =
            html;


    } catch (error) {

        console.error(
            "Ошибка загрузки каталога:",
            error
        );


        container.innerHTML = `

            <div class="error">

                Could not load collection.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

    }

}


loadProducts();


setInterval(
    loadProducts,
    3000
);

</script>

</body>
</html>
