<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        http-equiv="Cache-Control"
        content="no-cache, no-store, must-revalidate"
    >

    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>IXwear</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&family=UnifrakturCook:wght@700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;

            background: #080808;
            color: #fff;
        }

        body {
            overflow-x: hidden;
            font-family: "Cormorant Garamond", serif;
        }


        /* =====================================================
           HEADER
           ===================================================== */

        .header {
            width: 100%;
            height: 105px;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;

            background:
                radial-gradient(
                    ellipse at center,
                    #171717 0%,
                    #0d0d0d 55%,
                    #080808 100%
                );

            border-bottom: 1px solid #252525;

            border-radius:
                0 0 26px 26px;
        }


        /* =====================================================
           IXWEAR LOGO
           ===================================================== */

        .logo {
            display: flex;
            align-items: baseline;

            white-space: nowrap;

            line-height: 1;

            text-shadow:
                0 2px 8px rgba(0,0,0,.9);
        }

        .logo-ix {
            font-family: "Cinzel", serif;

            font-size: 43px;
            font-weight: 600;

            letter-spacing: -2px;

            color: #f1f1f1;
        }

        .logo-wear {
            margin-left: 4px;

            font-family: "Cormorant Garamond", serif;

            font-size: 31px;
            font-weight: 500;

            letter-spacing: 1px;

            color: #bdbdbd;
        }


        /* =====================================================
           MAIN
           ===================================================== */

        main {
            width: 100%;
            max-width: 1100px;

            margin: 0 auto;

            padding:
                35px 30px 70px;
        }


        /* =====================================================
           COLLECTION TITLE
           ===================================================== */

        .catalog-title {
            text-align: center;

            margin-bottom: 47px;
        }

        .title-line {
            display: flex;

            align-items: center;
            justify-content: center;

            gap: 18px;
        }

        .title-decoration {
            width: 70px;
            height: 20px;

            position: relative;
        }

        .title-decoration::before {
            content: "❧";

            position: absolute;

            left: 0;
            top: -8px;

            font-size: 24px;

            color: #737373;

            transform: rotate(180deg);
        }

        .title-decoration::after {
            content: "◇";

            position: absolute;

            right: 0;
            top: -5px;

            font-size: 14px;

            color: #555;
        }

        .title-decoration.right {
            transform: scaleX(-1);
        }

        .catalog-title h1 {
            margin: 0;

            font-family: "Cinzel", serif;

            font-size: 29px;
            font-weight: 500;

            letter-spacing: 5px;

            color: #e8e8e8;
        }

        .catalog-subtitle {
            margin-top: 9px;

            font-family: "Cormorant Garamond", serif;

            font-size: 21px;

            letter-spacing: 1px;

            color: #999;
        }


        /* =====================================================
           PRODUCTS
           ===================================================== */

        #products {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            column-gap: 55px;
            row-gap: 70px;
        }

        .product {
            min-width: 0;

            text-align: center;

            animation:
                productAppear .55s ease both;
        }

        @keyframes productAppear {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* =====================================================
           FRAME
           ===================================================== */

        .frame {
            position: relative;

            width: 100%;

            aspect-ratio: 0.76 / 1;

            background: #030303;

            overflow: visible;

            /* Outer dark metal */
            border: 13px solid #555;

            box-shadow:
                0 0 0 2px #111,
                0 0 0 5px #777,
                0 0 0 7px #252525,
                0 15px 35px rgba(0,0,0,.85);

            isolation: isolate;
        }


        /* =====================================================
           METALLIC FRAME LAYERS
           ===================================================== */

        .frame::before {
            content: "";

            position: absolute;

            inset: -10px;

            z-index: -1;

            background:
                linear-gradient(
                    135deg,
                    #343434 0%,
                    #c9c9c9 7%,
                    #777 15%,
                    #eeeeee 25%,
                    #555 37%,
                    #d8d8d8 48%,
                    #666 60%,
                    #eeeeee 73%,
                    #4a4a4a 87%,
                    #bdbdbd 100%
                );

            box-shadow:
                inset 0 0 0 2px #181818,
                inset 0 0 0 5px #8b8b8b,
                0 0 15px rgba(0,0,0,.8);
        }

        .frame::after {
            content: "";

            position: absolute;

            inset: -2px;

            z-index: 3;

            pointer-events: none;

            border:
                1px solid rgba(255,255,255,.55);

            box-shadow:
                inset 0 0 0 2px rgba(0,0,0,.75),
                inset 0 0 0 4px rgba(255,255,255,.16);
        }


        /* =====================================================
           INNER FRAME
           ===================================================== */

        .frame-inner {
            position: absolute;

            inset: 8px;

            z-index: 5;

            border:
                2px solid #bcbcbc;

            pointer-events: none;

            box-shadow:
                inset 0 0 0 2px #292929,
                inset 0 0 0 4px #777,
                inset 0 0 0 6px #171717;
        }

        .frame-inner::after {
            content: "";

            position: absolute;

            inset: 7px;

            border:
                1px solid #dedede;

            opacity: .75;
        }


        /* =====================================================
           INNER ORNAMENT LINES
           ===================================================== */

        .frame-inner::before {
            content: "";

            position: absolute;

            inset: 12px;

            border:
                1px solid rgba(255,255,255,.17);
        }


        /* =====================================================
           PRODUCT IMAGE
           ===================================================== */

        .image-area {
            position: absolute;

            top: 24px;
            right: 24px;
            bottom: 48px;
            left: 24px;

            background:
                radial-gradient(
                    ellipse at center,
                    #111 0%,
                    #070707 60%,
                    #020202 100%
                );

            overflow: hidden;

            z-index: 2;

            display: flex;

            align-items: center;
            justify-content: center;
        }

        .image-area::after {
            content: "";

            position: absolute;

            inset: 0;

            border:
                1px solid rgba(255,255,255,.06);

            pointer-events: none;
        }

        .product img {
            width: 100%;
            height: 100%;

            object-fit: contain;

            display: block;

            position: relative;

            z-index: 2;
        }


        /* =====================================================
           BAROQUE CORNER ORNAMENTS
           ===================================================== */

        .ornament {
            position: absolute;

            width: 92px;
            height: 92px;

            z-index: 20;

            pointer-events: none;
        }


        /* Main curved metal pieces */

        .ornament::before {
            content: "";

            position: absolute;

            width: 74px;
            height: 31px;

            top: 27px;
            left: 8px;

            border-radius:
                90% 10% 90% 10%;

            background:
                linear-gradient(
                    135deg,
                    #4a4a4a 0%,
                    #e9e9e9 18%,
                    #8b8b8b 35%,
                    #ffffff 49%,
                    #666 68%,
                    #d8d8d8 84%,
                    #555 100%
                );

            transform:
                rotate(45deg);

            box-shadow:
                0 3px 7px rgba(0,0,0,.9),
                inset 0 1px 1px rgba(255,255,255,.7);
        }


        .ornament::after {
            content: "";

            position: absolute;

            width: 57px;
            height: 22px;

            top: 35px;
            left: 17px;

            border-radius: 70%;

            background:
                linear-gradient(
                    90deg,
                    #555,
                    #ededed 25%,
                    #777 50%,
                    #ffffff 72%,
                    #555
                );

            transform:
                rotate(-45deg);

            box-shadow:
                0 2px 5px rgba(0,0,0,.8);
        }


        /* =====================================================
           ORNAMENT CENTER
           ===================================================== */

        .ornament .flower {
            position: absolute;

            width: 35px;
            height: 35px;

            left: 28px;
            top: 27px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    #fff 0 10%,
                    #aaa 11% 25%,
                    #eee 26% 45%,
                    #777 46% 65%,
                    #ddd 66% 75%,
                    #444 76% 100%
                );

            box-shadow:
                0 3px 7px rgba(0,0,0,.9),
                inset 0 1px 2px rgba(255,255,255,.8);
        }


        /* Petals */

        .ornament .petal {
            position: absolute;

            width: 21px;
            height: 34px;

            left: 35px;
            top: 3px;

            background:
                linear-gradient(
                    90deg,
                    #555,
                    #ededed 35%,
                    #888 55%,
                    #fff 75%,
                    #555
                );

            border-radius:
                75% 25% 75% 25%;

            box-shadow:
                0 2px 5px rgba(0,0,0,.75);
        }

        .ornament .petal:nth-child(2) {
            transform: rotate(90deg);

            top: 30px;
            left: 55px;
        }

        .ornament .petal:nth-child(3) {
            transform: rotate(180deg);

            top: 55px;
            left: 35px;
        }

        .ornament .petal:nth-child(4) {
            transform: rotate(270deg);

            top: 30px;
            left: 8px;
        }


        /* =====================================================
           EXTRA SMALL DOTS
           ===================================================== */

        .ornament .flower::after {
            content: "";

            position: absolute;

            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #fff;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            box-shadow:
                0 0 5px #fff;
        }


        /* =====================================================
           CORNER POSITIONS
           ===================================================== */

        .ornament.tl {
            top: -38px;
            left: -38px;
        }

        .ornament.tr {
            top: -38px;
            right: -38px;

            transform: scaleX(-1);
        }

        .ornament.bl {
            bottom: -38px;
            left: -38px;

            transform: scaleY(-1);
        }

        .ornament.br {
            bottom: -38px;
            right: -38px;

            transform: scale(-1);
        }


        /* =====================================================
           IXWEAR METAL PLAQUE
           ===================================================== */

        .frame-brand {
            position: absolute;

            left: 50%;
            bottom: -39px;

            transform:
                translateX(-50%);

            width: 152px;
            height: 50px;

            display: flex;

            align-items: center;
            justify-content: center;

            z-index: 30;

            background:
                linear-gradient(
                    180deg,
                    #555 0%,
                    #eeeeee 12%,
                    #ffffff 29%,
                    #999 50%,
                    #eeeeee 68%,
                    #666 88%,
                    #222 100%
                );

            border:
                2px solid #222;

            color: #080808;

            box-shadow:
                0 4px 9px rgba(0,0,0,.9),
                inset 0 0 0 1px #f4f4f4;
        }

        .frame-brand::before {
            content: "";

            position: absolute;

            inset: 5px;

            border:
                1px solid #555;

            box-shadow:
                inset 0 0 0 1px rgba(255,255,255,.55);
        }

        .brand-ix {
            font-family: "Cinzel", serif;

            font-size: 22px;

            font-weight: 700;

            letter-spacing: -1px;
        }

        .brand-wear {
            margin-left: 3px;

            font-family: "Cormorant Garamond", serif;

            font-size: 19px;

            font-weight: 600;

            letter-spacing: 1px;
        }


        /* =====================================================
           PRODUCT INFO
           ===================================================== */

        .info {
            padding-top: 53px;

            text-align: center;
        }

        .name {
            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 24px;

            line-height: 1.15;

            color: #eee;

            font-weight: 500;
        }

        .price {
            margin-top: 6px;

            font-family:
                "Cinzel",
                serif;

            font-size: 21px;

            letter-spacing: 2px;

            color: #fff;

            font-weight: 500;
        }

        .description {
            margin-top: 6px;

            color: #777;

            font-size: 15px;
        }


        /* =====================================================
           STATES
           ===================================================== */

        .loading,
        .empty,
        .error {
            grid-column: 1 / -1;

            text-align: center;

            padding: 70px 10px;

            font-size: 21px;

            color: #777;
        }

        .error {
            color: #c77;
        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 600px) {

            .header {
                height: 92px;

                border-radius:
                    0 0 22px 22px;
            }

            .logo-ix {
                font-size: 38px;
            }

            .logo-wear {
                font-size: 27px;
            }

            main {
                padding:
                    29px 15px 55px;
            }

            .catalog-title {
                margin-bottom: 40px;
            }

            .catalog-title h1 {
                font-size: 20px;

                letter-spacing: 3px;
            }

            .catalog-subtitle {
                font-size: 18px;
            }

            .title-decoration {
                width: 43px;
            }


            /* PRODUCT GRID */

            #products {
                column-gap: 25px;
                row-gap: 62px;
            }


            /* FRAME */

            .frame {
                border-width: 8px;

                aspect-ratio: .76 / 1;

                box-shadow:
                    0 0 0 2px #111,
                    0 0 0 4px #777,
                    0 0 0 6px #252525,
                    0 10px 25px rgba(0,0,0,.9);
            }

            .frame::before {
                inset: -7px;
            }

            .frame-inner {
                inset: 5px;
            }

            .frame-inner::after {
                inset: 4px;
            }

            .frame-inner::before {
                inset: 8px;
            }


            /* IMAGE */

            .image-area {
                top: 16px;
                right: 16px;
                bottom: 34px;
                left: 16px;
            }


            /* ORNAMENTS */

            .ornament {
                width: 62px;
                height: 62px;
            }

            .ornament::before {
                width: 50px;
                height: 15px;

                top: 20px;
                left: 6px;
            }

            .ornament::after {
                width: 39px;
                height: 11px;

                top: 25px;
                left: 12px;
            }

            .ornament .flower {
                width: 25px;
                height: 25px;

                left: 19px;
                top: 19px;
            }

            .ornament .petal {
                width: 14px;
                height: 23px;

                left: 24px;
                top: 2px;
            }

            .ornament .petal:nth-child(2) {
                top: 21px;
                left: 41px;
            }

            .ornament .petal:nth-child(3) {
                top: 38px;
                left: 24px;
            }

            .ornament .petal:nth-child(4) {
                top: 21px;
                left: 7px;
            }

            .ornament.tl {
                top: -25px;
                left: -25px;
            }

            .ornament.tr {
                top: -25px;
                right: -25px;
            }

            .ornament.bl {
                bottom: -25px;
                left: -25px;
            }

            .ornament.br {
                bottom: -25px;
                right: -25px;
            }


            /* PLAQUE */

            .frame-brand {
                width: 94px;
                height: 32px;

                bottom: -23px;

                border-width: 1px;
            }

            .frame-brand::before {
                inset: 3px;
            }

            .brand-ix {
                font-size: 15px;
            }

            .brand-wear {
                font-size: 14px;
            }


            /* INFO */

            .info {
                padding-top: 32px;
            }

            .name {
                font-size: 17px;
            }

            .price {
                font-size: 15px;

                letter-spacing: 1px;
            }

            .description {
                font-size: 12px;
            }
        }


        /* =====================================================
           VERY SMALL PHONES
           ===================================================== */

        @media (max-width: 380px) {

            main {
                padding-left: 11px;
                padding-right: 11px;
            }

            .logo-ix {
                font-size: 34px;
            }

            .logo-wear {
                font-size: 24px;
            }

            #products {
                column-gap: 19px;
            }

            .name {
                font-size: 15px;
            }

            .price {
                font-size: 14px;
            }
        }

    </style>
</head>


<body>

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="header">

        <div class="logo">
            <span class="logo-ix">IX</span>
            <span class="logo-wear">wear</span>
        </div>

    </header>


    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main>

        <section class="catalog-title">

            <div class="title-line">

                <span class="title-decoration"></span>

                <h1>
                    COLLECTION
                </h1>

                <span class="title-decoration right"></span>

            </div>

            <div class="catalog-subtitle">
                CHOOSE YOUR STYLE
            </div>

        </section>


        <div id="products">

            <div class="loading">
                Loading collection...
            </div>

        </div>

    </main>


    <script>

        /* =====================================================
           TELEGRAM
           ===================================================== */

        const tg = window.Telegram.WebApp;

        tg.ready();
        tg.expand();


        /* =====================================================
           CONTAINER
           ===================================================== */

        const container =
            document.getElementById("products");


        /* =====================================================
           ESCAPE HTML
           ===================================================== */

        function escapeHtml(text) {

            const div =
                document.createElement("div");

            div.textContent =
                String(text);

            return div.innerHTML;
        }


        /* =====================================================
           IXWEAR BRAND
           ===================================================== */

        function brandHTML() {

            return `
                <span class="brand-ix">IX</span>
                <span class="brand-wear">wear</span>
            `;
        }


        /* =====================================================
           LOAD PRODUCTS
           ===================================================== */

        async function loadProducts() {

            try {

                const cacheBuster =
                    Date.now() +
                    "_" +
                    Math.random()
                        .toString(36)
                        .substring(2);


                const response =
                    await fetch(
                        "products.json?cache=" +
                        cacheBuster,
                        {
                            method: "GET",

                            cache: "no-store",

                            headers: {
                                "Cache-Control":
                                    "no-cache",

                                "Pragma":
                                    "no-cache"
                            }
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "HTTP " +
                        response.status
                    );
                }


                const products =
                    await response.json();


                if (!Array.isArray(products)) {

                    throw new Error(
                        "products.json имеет неправильный формат"
                    );
                }


                if (products.length === 0) {

                    container.innerHTML = `
                        <div class="empty">
                            Collection is empty
                        </div>
                    `;

                    return;
                }


                let html = "";


                products.forEach(
                    (product, index) => {

                        const name =
                            escapeHtml(
                                product.name || ""
                            );


                        const price =
                            escapeHtml(
                                product.price || ""
                            );


                        const description =
                            escapeHtml(
                                product.description || ""
                            );


                        const imageUrl =
                            product.image
                                ? product.image +
                                  (
                                      product.image.includes("?")
                                      ? "&"
                                      : "?"
                                  ) +
                                  "v=" +
                                  Date.now()
                                : "";


                        html += `

                            <article
                                class="product"
                                style="
                                    animation-delay:
                                    ${index * 0.06}s;
                                "
                            >

                                <div class="frame">

                                    <div class="frame-inner"></div>


                                    <!-- PRODUCT IMAGE -->

                                    <div class="image-area">

                                        ${
                                            imageUrl
                                            ? `
                                                <img
                                                    src="${imageUrl}"
                                                    alt="${name}"
                                                    loading="lazy"
                                                    onerror="
                                                        this.style.display='none';
                                                    "
                                                >
                                            `
                                            : ""
                                        }

                                    </div>


                                    <!-- TOP LEFT -->

                                    <div class="ornament tl">

                                        <div class="flower"></div>

                                        <div class="petal"></div>
                                        <div class="petal"></div>
                                        <div class="petal"></div>
                                        <div class="petal"></div>

                                    </div>


                                    <!-- TOP RIGHT -->

                                    <div class="ornament tr">

                                        <div class="flower"></div>

                                        <div class="petal"></div>
                                        <div class="petal"></div>
                                        <div class="petal"></div>
                                        <div class="petal"></div>

                                    </div>


                                    <!-- BOTTOM LEFT -->

                                    <div class="ornament bl">

                                        <div class="flower"></div>

                                        <div class="petal"></div>
                                        <div class="petal"></div>
                                        <div class="petal"></div>
                                        <div class="petal"></div>

                                    </div>


                                    <!-- BOTTOM RIGHT -->

                                    <div class="ornament br">

                                        <div class="flower"></div>

                                        <div class="petal"></div>
                                        <div class="petal"></div>
                                        <div class="petal"></div>
                                        <div class="petal"></div>

                                    </div>


                                    <!-- IXWEAR -->

                                    <div class="frame-brand">
                                        ${brandHTML()}
                                    </div>

                                </div>


                                <!-- PRODUCT INFO -->

                                <div class="info">

                                    <div class="name">
                                        ${name}
                                    </div>

                                    <div class="price">
                                        ${price}
                                    </div>

                                    ${
                                        description
                                        ? `
                                            <div class="description">
                                                ${description}
                                            </div>
                                        `
                                        : ""
                                    }

                                </div>

                            </article>

                        `;
                    }
                );


                container.innerHTML =
                    html;


            } catch (error) {

                console.error(
                    "Ошибка загрузки каталога:",
                    error
                );


                container.innerHTML = `

                    <div class="error">

                        Could not load collection.

                        <br><br>

                        ${escapeHtml(
                            error.message
                        )}

                    </div>

                `;
            }
        }


        /* =====================================================
           START
           ===================================================== */

        loadProducts();


        /* =====================================================
           AUTO UPDATE
           ===================================================== */

        setInterval(
            loadProducts,
            3000
        );

    </script>

</body>
</html>
