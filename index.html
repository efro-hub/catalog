<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        http-equiv="Cache-Control"
        content="no-cache, no-store, must-revalidate"
    >

    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>IXwear</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:wght@400;500;600&family=UnifrakturCook:wght@700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;

            background: #090909;
            color: #fff;
        }

        body {
            overflow-x: hidden;
            font-family: "Cormorant Garamond", serif;
        }


        /* =====================================================
           HEADER
           ===================================================== */

        .header {
            height: 130px;

            width: 100%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 42px;

            position: relative;

            background:
                radial-gradient(
                    circle at center,
                    #151515 0%,
                    #0c0c0c 60%,
                    #080808 100%
                );

            border-bottom: 1px solid #1b1b1b;

            border-radius:
                0 0 28px 28px;
        }


        /* =====================================================
           BURGER
           ===================================================== */

        .header-button {
            width: 50px;
            height: 50px;

            padding: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background: transparent;
            border: 0;
        }


        .burger {
            width: 41px;
            height: 34px;

            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }


        .burger span {
            width: 41px;
            height: 4px;

            display: block;

            background: #f2f2f2;

            border-radius: 4px;
        }


        /* =====================================================
           LOGO
           ===================================================== */

        .logo {
            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            white-space: nowrap;

            font-family:
                "UnifrakturCook",
                serif;

            font-size: 52px;

            color: #f4f4f4;

            line-height: 1;

            text-shadow:
                0 2px 5px rgba(0,0,0,.8);
        }


        /* =====================================================
           BAG
           ===================================================== */

        .bag {
            width: 34px;
            height: 34px;

            position: relative;

            border: 3px solid #f3f3f3;

            border-radius:
                4px 4px 7px 7px;
        }


        .bag::before {
            content: "";

            position: absolute;

            width: 17px;
            height: 14px;

            left: 50%;
            top: -14px;

            transform:
                translateX(-50%);

            border:
                3px solid #f3f3f3;

            border-bottom: 0;

            border-radius:
                12px 12px 0 0;
        }


        /* =====================================================
           MAIN
           ===================================================== */

        main {
            width: 100%;
            max-width: 1100px;

            margin: 0 auto;

            padding:
                34px 30px 60px;
        }


        /* =====================================================
           TITLE
           ===================================================== */

        .catalog-title {
            text-align: center;

            margin-bottom: 42px;
        }


        .title-line {
            display: flex;

            align-items: center;
            justify-content: center;

            gap: 18px;
        }


        .title-decoration {
            width: 78px;
            height: 18px;

            position: relative;
        }


        .title-decoration::before {
            content: "❧";

            position: absolute;

            left: 0;
            top: -8px;

            font-size: 25px;

            color: #696969;

            transform: rotate(180deg);
        }


        .title-decoration::after {
            content: "◇";

            position: absolute;

            right: 0;
            top: -5px;

            font-size: 15px;

            color: #4f4f4f;
        }


        .title-decoration.right {
            transform: scaleX(-1);
        }


        .catalog-title h1 {
            margin: 0;

            font-family:
                "Cinzel",
                serif;

            font-size: 32px;

            font-weight: 500;

            letter-spacing: 4px;

            color: #e9e9e9;
        }


        .catalog-subtitle {
            margin-top: 8px;

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 24px;

            color: #cfcfcf;
        }


        /* =====================================================
           PRODUCTS GRID
           ===================================================== */

        #products {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            column-gap: 55px;
            row-gap: 60px;
        }


        /* =====================================================
           PRODUCT
           ===================================================== */

        .product {
            min-width: 0;

            text-align: center;

            animation:
                productAppear .5s ease both;
        }


        @keyframes productAppear {

            from {
                opacity: 0;

                transform:
                    translateY(15px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        /* =====================================================
           BAROQUE FRAME
           ===================================================== */

        .frame {
            position: relative;

            width: 100%;

            aspect-ratio:
                0.76 / 1;

            background: #050505;

            overflow: visible;

            border: 11px solid transparent;

            border-image:
                linear-gradient(
                    135deg,
                    #777 0%,
                    #ffffff 10%,
                    #b7b7b7 20%,
                    #ffffff 34%,
                    #8d8d8d 48%,
                    #eeeeee 65%,
                    #999999 80%,
                    #ffffff 94%
                ) 1;

            box-shadow:
                0 0 0 2px #303030,
                0 10px 25px rgba(0,0,0,.75);
        }


        /* =====================================================
           INNER FRAME
           ===================================================== */

        .frame-inner {
            position: absolute;

            inset: 7px;

            border:
                2px solid #bdbdbd;

            box-shadow:
                inset 0 0 0 2px #414141;

            z-index: 4;

            pointer-events: none;
        }


        .frame-inner::after {
            content: "";

            position: absolute;

            inset: 5px;

            border:
                1px solid #dedede;
        }


        /* =====================================================
           DECORATIVE CORNERS
           ===================================================== */

        .ornament {
            position: absolute;

            width: 75px;
            height: 75px;

            z-index: 10;

            pointer-events: none;
        }


        .ornament::before,
        .ornament::after {
            content: "";

            position: absolute;

            background:
                linear-gradient(
                    135deg,
                    #777777,
                    #ffffff 25%,
                    #bcbcbc 45%,
                    #ffffff 65%,
                    #777777
                );

            box-shadow:
                0 2px 4px rgba(0,0,0,.7);
        }


        /* большой диагональный элемент */

        .ornament::before {
            width: 65px;
            height: 17px;

            top: 25px;
            left: 5px;

            border-radius:
                50% 15% 50% 15%;

            transform:
                rotate(45deg);
        }


        /* второй лепесток */

        .ornament::after {
            width: 52px;
            height: 13px;

            top: 31px;
            left: 13px;

            border-radius:
                50%;

            transform:
                rotate(-45deg);
        }


        /* =====================================================
           FLOWER CIRCLE
           ===================================================== */

        .ornament .flower {
            position: absolute;

            width: 31px;
            height: 31px;

            left: 18px;
            top: 20px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    #ffffff 0 15%,
                    #bcbcbc 16% 35%,
                    #eeeeee 36% 55%,
                    #777777 56% 100%
                );

            box-shadow:
                0 2px 5px rgba(0,0,0,.7);
        }


        .ornament .petal {
            position: absolute;

            width: 18px;
            height: 28px;

            background:
                linear-gradient(
                    90deg,
                    #888,
                    #fff,
                    #aaa
                );

            border-radius:
                70% 30% 70% 30%;

            left: 24px;
            top: 2px;
        }


        .ornament .petal:nth-child(2) {
            transform:
                rotate(90deg);

            top: 24px;
            left: 47px;
        }


        .ornament .petal:nth-child(3) {
            transform:
                rotate(180deg);

            top: 46px;
            left: 24px;
        }


        .ornament .petal:nth-child(4) {
            transform:
                rotate(270deg);

            top: 24px;
            left: 2px;
        }


        /* =====================================================
           POSITIONS
           ===================================================== */

        .ornament.tl {
            top: -27px;
            left: -27px;
        }


        .ornament.tr {
            top: -27px;
            right: -27px;

            transform:
                scaleX(-1);
        }


        .ornament.bl {
            bottom: -27px;
            left: -27px;

            transform:
                scaleY(-1);
        }


        .ornament.br {
            bottom: -27px;
            right: -27px;

            transform:
                scale(-1);
        }


        /* =====================================================
           IMAGE AREA
           ===================================================== */

        .image-area {
            position: absolute;

            top: 19px;
            right: 19px;
            bottom: 43px;
            left: 19px;

            background: #050505;

            overflow: hidden;

            z-index: 2;

            display: flex;

            align-items: center;
            justify-content: center;
        }


        .image-area::before {
            content: "";

            position: absolute;

            inset: 0;

            background:
                radial-gradient(
                    ellipse at center,
                    rgba(255,255,255,.025),
                    transparent 65%
                );

            pointer-events: none;
        }


        .product img {
            width: 100%;
            height: 100%;

            object-fit: contain;

            display: block;
        }


        /* =====================================================
           BOTTOM IXWEAR PLAQUE
           ===================================================== */

        .frame-brand {
            position: absolute;

            left: 50%;
            bottom: -35px;

            transform:
                translateX(-50%);

            width: 145px;
            height: 48px;

            display: flex;

            align-items: center;
            justify-content: center;

            z-index: 20;

            background:
                linear-gradient(
                    180deg,
                    #eeeeee 0%,
                    #ffffff 23%,
                    #a5a5a5 52%,
                    #eeeeee 78%,
                    #777777 100%
                );

            color: #050505;

            font-family:
                "UnifrakturCook",
                serif;

            font-size: 24px;

            border:
                2px solid #777;

            border-radius:
                4px 4px 15px 15px;

            box-shadow:
                0 3px 6px rgba(0,0,0,.8);
        }


        .frame-brand::before {
            content: "";

            position: absolute;

            inset: 4px;

            border:
                1px solid #666;

            border-radius:
                2px 2px 12px 12px;
        }


        /* =====================================================
           PRODUCT INFO
           ===================================================== */

        .info {
            padding-top: 48px;

            text-align: center;
        }


        .name {
            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 24px;

            line-height: 1.15;

            color: #eeeeee;

            font-weight: 500;
        }


        .price {
            margin-top: 5px;

            font-family:
                "Cinzel",
                serif;

            font-size: 23px;

            letter-spacing: 2px;

            color: #ffffff;

            font-weight: 500;
        }


        .description {
            margin-top: 6px;

            color: #888;

            font-size: 15px;
        }


        /* =====================================================
           LOADING
           ===================================================== */

        .loading,
        .empty,
        .error {
            grid-column: 1 / -1;

            text-align: center;

            padding: 70px 10px;

            font-size: 21px;

            color: #888;
        }


        .error {
            color: #d98c8c;
        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 600px) {

            .header {
                height: 130px;

                padding:
                    0 29px;

                border-radius:
                    0 0 25px 25px;
            }


            .logo {
                font-size: 43px;
            }


            .burger {
                width: 39px;
                height: 32px;
            }


            .burger span {
                width: 39px;
                height: 4px;
            }


            .bag {
                width: 32px;
                height: 32px;
            }


            main {
                padding:
                    31px 16px 50px;
            }


            .catalog-title {
                margin-bottom: 37px;
            }


            .catalog-title h1 {
                font-size: 22px;

                letter-spacing: 2.5px;
            }


            .catalog-subtitle {
                font-size: 20px;
            }


            .title-decoration {
                width: 45px;
            }


            #products {
                column-gap: 30px;

                row-gap: 57px;
            }


            .frame {
                border-width: 7px;

                aspect-ratio:
                    0.76 / 1;
            }


            .frame-inner {
                inset: 5px;
            }


            .frame-inner::after {
                inset: 3px;
            }


            .image-area {
                top: 13px;
                left: 13px;
                right: 13px;
                bottom: 32px;
            }


            .ornament {
                width: 58px;
                height: 58px;
            }


            .ornament::before {
                width: 50px;
                height: 13px;

                top: 20px;
            }


            .ornament::after {
                width: 40px;
                height: 10px;

                top: 25px;
                left: 10px;
            }


            .ornament .flower {
                width: 25px;
                height: 25px;

                left: 15px;
                top: 16px;
            }


            .ornament .petal {
                width: 14px;
                height: 22px;

                left: 20px;
            }


            .ornament .petal:nth-child(2) {
                top: 20px;
                left: 39px;
            }


            .ornament .petal:nth-child(3) {
                top: 38px;
                left: 20px;
            }


            .ornament .petal:nth-child(4) {
                top: 20px;
                left: 2px;
            }


            .ornament.tl {
                top: -20px;
                left: -20px;
            }


            .ornament.tr {
                top: -20px;
                right: -20px;
            }


            .ornament.bl {
                bottom: -20px;
                left: -20px;
            }


            .ornament.br {
                bottom: -20px;
                right: -20px;
            }


            .frame-brand {
                width: 88px;
                height: 30px;

                bottom: -22px;

                font-size: 16px;

                border-width: 1px;

                border-radius:
                    3px 3px 10px 10px;
            }


            .frame-brand::before {
                inset: 3px;
            }


            .info {
                padding-top: 31px;
            }


            .name {
                font-size: 17px;
            }


            .price {
                font-size: 16px;

                letter-spacing: 1px;
            }


            .description {
                font-size: 12px;
            }
        }


        /* =====================================================
           VERY SMALL PHONES
           ===================================================== */

        @media (max-width: 380px) {

            .header {
                padding:
                    0 20px;
            }


            .logo {
                font-size: 37px;
            }


            .burger {
                width: 34px;
                height: 28px;
            }


            .burger span {
                width: 34px;
                height: 3px;
            }


            .bag {
                width: 29px;
                height: 29px;
            }


            main {
                padding-left: 12px;
                padding-right: 12px;
            }


            #products {
                column-gap: 22px;
            }


            .name {
                font-size: 15px;
            }


            .price {
                font-size: 14px;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="header">

        <button
            class="header-button"
            type="button"
            aria-label="Menu"
        >

            <div class="burger">
                <span></span>
                <span></span>
                <span></span>
            </div>

        </button>


        <div class="logo">
            IXwear
        </div>


        <button
            class="header-button"
            type="button"
            aria-label="Shopping bag"
        >

            <div class="bag"></div>

        </button>

    </header>


    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main>


        <section class="catalog-title">

            <div class="title-line">

                <span class="title-decoration"></span>

                <h1>
                    COLLECTION
                </h1>

                <span
                    class="title-decoration right"
                ></span>

            </div>


            <div class="catalog-subtitle">
                CHOOSE YOUR STYLE
            </div>

        </section>


        <div id="products">

            <div class="loading">
                Loading collection...
            </div>

        </div>


    </main>


    <script>

        /* =====================================================
           TELEGRAM
           ===================================================== */

        const tg =
            window.Telegram.WebApp;

        tg.ready();
        tg.expand();


        /* =====================================================
           CONTAINER
           ===================================================== */

        const container =
            document.getElementById(
                "products"
            );


        /* =====================================================
           ESCAPE HTML
           ===================================================== */

        function escapeHtml(text) {

            const div =
                document.createElement(
                    "div"
                );

            div.textContent =
                String(text);

            return div.innerHTML;
        }


        /* =====================================================
           LOAD PRODUCTS
           ===================================================== */

        async function loadProducts() {

            try {

                const cacheBuster =
                    Date.now() +
                    "_" +
                    Math.random()
                        .toString(36)
                        .substring(2);


                const response =
                    await fetch(
                        "products.json?cache=" +
                        cacheBuster,
                        {
                            method: "GET",

                            cache: "no-store",

                            headers: {
                                "Cache-Control":
                                    "no-cache",

                                "Pragma":
                                    "no-cache"
                            }
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "HTTP " +
                        response.status
                    );
                }


                const products =
                    await response.json();


                if (
                    !Array.isArray(products)
                ) {

                    throw new Error(
                        "products.json имеет неправильный формат"
                    );
                }


                if (
                    products.length === 0
                ) {

                    container.innerHTML = `

                        <div class="empty">
                            Collection is empty
                        </div>

                    `;

                    return;
                }


                /* =============================================
                   CREATE PRODUCTS
                   ============================================= */

                let html = "";


                products.forEach(
                    (product, index) => {

                        const name =
                            escapeHtml(
                                product.name || ""
                            );


                        const price =
                            escapeHtml(
                                product.price || ""
                            );


                        const description =
                            escapeHtml(
                                product.description || ""
                            );


                        let imageHtml = "";


                        if (
                            product.image
                        ) {

                            const imageUrl =
                                product.image +
                                (
                                    product.image.includes("?")
                                    ? "&"
                                    : "?"
                                ) +
                                "v=" +
                                Date.now();


                            imageHtml = `

                                <div class="image-area">

                                    <img
                                        src="${imageUrl}"
                                        alt="${name}"
                                        loading="lazy"
                                        onerror="
                                            this.style.display='none';
                                        "
                                    >

                                </div>

                            `;
                        }


                        html += `

                            <article
                                class="product"
                                style="
                                    animation-delay:
                                    ${index * 0.06}s;
                                "
                            >

                                <div class="frame">

                                    <div
                                        class="frame-inner"
                                    ></div>


                                    <div class="image-area">

                                        ${
                                            product.image
                                            ? `
                                                <img
                                                    src="${
                                                        product.image +
                                                        (
                                                            product.image.includes("?")
                                                            ? "&"
                                                            : "?"
                                                        ) +
                                                        "v=" +
                                                        Date.now()
                                                    }"
                                                    alt="${name}"
                                                    loading="lazy"
                                                >
                                            `
                                            : ""
                                        }

                                    </div>


                                    <!-- TOP LEFT -->

                                    <div class="ornament tl">

                                        <div class="flower"></div>

                                        <div class="petal"></div>
                                        <div class="petal"></div>
                                        <div class="petal"></div>
                                        <div class="petal"></div>

                                    </div>


                                    <!-- TOP RIGHT -->

                                    <div class="ornament tr">

                                        <div class="flower"></div>

                                        <div class="petal"></div>
                                        <div class="petal"></div>
                                        <div class="petal"></div>
                                        <div class="petal"></div>

                                    </div>


                                    <!-- BOTTOM LEFT -->

                                    <div class="ornament bl">

                                        <div class="flower"></div>

                                        <div class="petal"></div>
                                        <div class="petal"></div>
                                        <div class="petal"></div>
                                        <div class="petal"></div>

                                    </div>


                                    <!-- BOTTOM RIGHT -->

                                    <div class="ornament br">

                                        <div class="flower"></div>

                                        <div class="petal"></div>
                                        <div class="petal"></div>
                                        <div class="petal"></div>
                                        <div class="petal"></div>

                                    </div>


                                    <!-- IXWEAR -->

                                    <div class="frame-brand">
                                        IXwear
                                    </div>

                                </div>


                                <div class="info">

                                    <div class="name">
                                        ${name}
                                    </div>


                                    <div class="price">
                                        ${price}
                                    </div>


                                    ${
                                        description
                                        ? `
                                            <div class="description">
                                                ${description}
                                            </div>
                                        `
                                        : ""
                                    }

                                </div>

                            </article>

                        `;
                    }
                );


                container.innerHTML =
                    html;


            } catch (error) {

                console.error(
                    "Ошибка загрузки каталога:",
                    error
                );


                container.innerHTML = `

                    <div class="error">

                        Could not load collection.

                        <br><br>

                        ${escapeHtml(
                            error.message
                        )}

                    </div>

                `;
            }
        }


        /* =====================================================
           START
           ===================================================== */

        loadProducts();


        /* =====================================================
           AUTO UPDATE
           ===================================================== */

        setInterval(
            loadProducts,
            3000
        );

    </script>

</body>
</html>
