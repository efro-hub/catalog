<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        http-equiv="Cache-Control"
        content="no-cache, no-store, must-revalidate"
    >

    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>IXwear</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;

            background: #080808;
            color: #fff;
        }

        body {
            overflow-x: hidden;
            font-family: "Cormorant Garamond", serif;
        }


        /* =====================================================
           HEADER
           ===================================================== */

        .header {
            width: 100%;
            height: 105px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    ellipse at center,
                    #171717 0%,
                    #0d0d0d 55%,
                    #080808 100%
                );

            border-bottom: 1px solid #252525;

            border-radius:
                0 0 26px 26px;
        }


        /* =====================================================
           IXWEAR LOGO
           ===================================================== */

        .logo {
            display: flex;
            align-items: baseline;

            white-space: nowrap;

            line-height: 1;

            text-shadow:
                0 2px 8px rgba(0,0,0,.9);
        }

        .logo-ix {
            font-family: "Cinzel", serif;

            font-size: 43px;
            font-weight: 600;

            letter-spacing: -2px;

            color: #f1f1f1;
        }

        .logo-wear {
            margin-left: 4px;

            font-family: "Cormorant Garamond", serif;

            font-size: 31px;
            font-weight: 500;

            letter-spacing: 1px;

            color: #bdbdbd;
        }


        /* =====================================================
           MAIN
           ===================================================== */

        main {
            width: 100%;
            max-width: 1100px;

            margin: 0 auto;

            padding:
                35px 30px 80px;
        }


        /* =====================================================
           COLLECTION TITLE
           ===================================================== */

        .catalog-title {
            text-align: center;

            margin-bottom: 50px;
        }

        .title-line {
            display: flex;

            align-items: center;
            justify-content: center;

            gap: 18px;
        }

        .title-decoration {
            width: 70px;
            height: 20px;

            position: relative;
        }

        .title-decoration::before {
            content: "❧";

            position: absolute;

            left: 0;
            top: -8px;

            font-size: 24px;

            color: #737373;

            transform: rotate(180deg);
        }

        .title-decoration::after {
            content: "◇";

            position: absolute;

            right: 0;
            top: -5px;

            font-size: 14px;

            color: #555;
        }

        .title-decoration.right {
            transform: scaleX(-1);
        }

        .catalog-title h1 {
            margin: 0;

            font-family: "Cinzel", serif;

            font-size: 29px;
            font-weight: 500;

            letter-spacing: 5px;

            color: #e8e8e8;
        }

        .catalog-subtitle {
            margin-top: 9px;

            font-family: "Cormorant Garamond", serif;

            font-size: 21px;

            letter-spacing: 1px;

            color: #999;
        }


        /* =====================================================
           PRODUCTS
           ===================================================== */

        #products {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            column-gap: 55px;
            row-gap: 80px;
        }

        .product {
            min-width: 0;

            text-align: center;

            animation:
                productAppear .55s ease both;
        }

        @keyframes productAppear {

            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* =====================================================
           LUXURY ANTIQUE FRAME
           ===================================================== */

        .frame {

            position: relative;

            width: 100%;

            aspect-ratio:
                0.76 / 1;

            background:
                #030303;

            overflow: visible;

            isolation: isolate;

            /* thick white carved frame */
            border: 14px solid transparent;

            border-image:
                linear-gradient(
                    135deg,

                    #777 0%,
                    #ffffff 8%,
                    #d8d8d8 16%,
                    #ffffff 25%,

                    #9b9b9b 36%,
                    #f8f8f8 47%,

                    #b1b1b1 59%,
                    #ffffff 71%,

                    #a1a1a1 82%,
                    #ffffff 93%,
                    #777 100%
                ) 1;

            box-shadow:

                0 0 0 2px #242424,

                0 0 0 5px #dadada,

                0 0 0 8px #5d5d5d,

                0 0 0 10px #151515,

                0 18px 38px
                rgba(0,0,0,.9);
        }


        /* =====================================================
           CARVED INNER BORDER
           ===================================================== */

        .frame::before {

            content: "";

            position: absolute;

            inset: -7px;

            z-index: 4;

            pointer-events: none;

            border:

                3px solid #f4f4f4;

            box-shadow:

                inset 0 0 0 2px #777,

                inset 0 0 0 5px #ffffff,

                inset 0 0 0 7px #9b9b9b,

                0 0 5px rgba(0,0,0,.8);
        }


        /* =====================================================
           INNER GOLDLESS CARVED LINE
           ===================================================== */

        .frame::after {

            content: "";

            position: absolute;

            inset: 9px;

            z-index: 6;

            pointer-events: none;

            border:

                2px solid #d8d8d8;

            box-shadow:

                inset 0 0 0 2px #454545,

                inset 0 0 0 4px #eeeeee,

                inset 0 0 0 6px #202020;
        }


        /* =====================================================
           IMAGE AREA
           ===================================================== */

        .image-area {

            position: absolute;

            top: 26px;
            right: 27px;
            bottom: 52px;
            left: 27px;

            background:
                radial-gradient(
                    ellipse at center,

                    #141414 0%,
                    #080808 55%,
                    #020202 100%
                );

            overflow: hidden;

            z-index: 3;

            display: flex;

            align-items: center;
            justify-content: center;
        }

        .image-area::before {

            content: "";

            position: absolute;

            inset: 0;

            background:

                radial-gradient(
                    ellipse at center,

                    rgba(255,255,255,.035),
                    transparent 68%
                );

            pointer-events: none;
        }

        .image-area::after {

            content: "";

            position: absolute;

            inset: 0;

            border:
                1px solid rgba(255,255,255,.12);

            pointer-events: none;
        }

        .product img {

            width: 100%;
            height: 100%;

            object-fit: contain;

            display: block;

            position: relative;

            z-index: 3;
        }


        /* =====================================================
           BAROQUE CORNERS
           ===================================================== */

        .ornament {

            position: absolute;

            width: 105px;
            height: 105px;

            z-index: 30;

            pointer-events: none;
        }


        /* =====================================================
           MAIN BAROQUE CURL
           ===================================================== */

        .ornament::before {

            content: "";

            position: absolute;

            width: 82px;
            height: 82px;

            left: 8px;
            top: 8px;

            border-radius:

                75% 15% 75% 15%;

            background:

                radial-gradient(
                    ellipse at 30% 30%,

                    #ffffff 0%,
                    #eeeeee 18%,
                    #aaaaaa 34%,
                    #ffffff 45%,
                    #cfcfcf 60%,
                    #777777 78%,
                    #eeeeee 100%
                );

            transform:

                rotate(45deg);

            box-shadow:

                0 5px 9px
                rgba(0,0,0,.85),

                inset 3px 3px 4px
                rgba(255,255,255,.85),

                inset -4px -4px 5px
                rgba(0,0,0,.38);
        }


        /* =====================================================
           BAROQUE SECOND CURL
           ===================================================== */

        .ornament::after {

            content: "";

            position: absolute;

            width: 58px;
            height: 58px;

            left: 24px;
            top: 24px;

            border:

                8px solid #d7d7d7;

            border-left-color:
                #ffffff;

            border-top-color:
                #8d8d8d;

            border-radius:
                50%;

            box-shadow:

                0 4px 7px
                rgba(0,0,0,.7),

                inset 2px 2px 3px
                rgba(255,255,255,.9);
        }


        /* =====================================================
           CENTRAL FLOWER
           ===================================================== */

        .ornament .flower {

            position: absolute;

            width: 38px;
            height: 38px;

            left: 34px;
            top: 34px;

            z-index: 10;

            border-radius: 50%;

            background:

                radial-gradient(
                    circle,

                    #ffffff 0%,
                    #d9d9d9 28%,
                    #8b8b8b 45%,
                    #f7f7f7 62%,
                    #999999 78%,
                    #ffffff 100%
                );

            box-shadow:

                0 3px 7px
                rgba(0,0,0,.8),

                inset 2px 2px 3px
                rgba(255,255,255,.9);
        }


        /* =====================================================
           FLOWER PETALS
           ===================================================== */

        .ornament .petal {

            position: absolute;

            width: 25px;
            height: 40px;

            left: 41px;
            top: 5px;

            z-index: 8;

            border-radius:

                80% 20% 80% 20%;

            background:

                linear-gradient(
                    90deg,

                    #888 0%,
                    #ffffff 28%,
                    #d5d5d5 52%,
                    #ffffff 72%,
                    #777 100%
                );

            box-shadow:

                0 3px 5px
                rgba(0,0,0,.7);
        }

        .ornament .petal:nth-child(2) {

            transform:
                rotate(90deg);

            top: 41px;
            left: 61px;
        }

        .ornament .petal:nth-child(3) {

            transform:
                rotate(180deg);

            top: 61px;
            left: 41px;
        }

        .ornament .petal:nth-child(4) {

            transform:
                rotate(270deg);

            top: 41px;
            left: 5px;
        }


        /* =====================================================
           SMALL CARVED DOT
           ===================================================== */

        .ornament .flower::after {

            content: "";

            position: absolute;

            width: 9px;
            height: 9px;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            background:
                #ffffff;

            box-shadow:

                0 0 6px
                rgba(255,255,255,.8);
        }


        /* =====================================================
           CORNER POSITIONS
           ===================================================== */

        .ornament.tl {

            top: -48px;
            left: -48px;
        }

        .ornament.tr {

            top: -48px;
            right: -48px;

            transform:
                scaleX(-1);
        }

        .ornament.bl {

            bottom: -48px;
            left: -48px;

            transform:
                scaleY(-1);
        }

        .ornament.br {

            bottom: -48px;
            right: -48px;

            transform:
                scale(-1);
        }


        /* =====================================================
           EXTRA BAROQUE DECORATION
           ===================================================== */

        .ornament .petal::after {

            content: "";

            position: absolute;

            width: 8px;
            height: 8px;

            right: -4px;
            top: 4px;

            border-radius: 50%;

            background:
                #f5f5f5;

            box-shadow:
                0 1px 3px
                rgba(0,0,0,.7);
        }


        /* =====================================================
           IXWEAR BLACK PLAQUE
           ===================================================== */

        .frame-brand {

            position: absolute;

            left: 50%;
            bottom: -43px;

            transform:
                translateX(-50%);

            width: 165px;
            height: 54px;

            display: flex;

            align-items: center;
            justify-content: center;

            z-index: 50;

            background:

                linear-gradient(
                    180deg,

                    #050505 0%,
                    #171717 30%,
                    #020202 55%,
                    #111111 100%
                );

            color:
                #050505;

            border:
                3px solid #eeeeee;

            box-shadow:

                0 5px 12px
                rgba(0,0,0,.9),

                inset 0 0 0 2px #555,

                inset 0 0 0 4px #111;
        }


        /* silver edge */

        .frame-brand::before {

            content: "";

            position: absolute;

            inset: 5px;

            border:
                1px solid #aaa;

            pointer-events: none;
        }


        /* IXwear text */

        .brand-ix {

            font-family:
                "Cinzel",
                serif;

            font-size: 22px;

            font-weight: 700;

            letter-spacing: -1px;

            color: #ffffff;

            text-shadow:
                0 1px 2px #000;
        }

        .brand-wear {

            margin-left: 4px;

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 21px;

            font-weight: 600;

            letter-spacing: 1px;

            color: #ffffff;
        }


        /* =====================================================
           PRODUCT INFO
           ===================================================== */

        .info {

            padding-top: 58px;

            text-align: center;
        }

        .name {

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 24px;

            line-height: 1.15;

            color: #eeeeee;

            font-weight: 500;
        }

        .price {

            margin-top: 6px;

            font-family:
                "Cinzel",
                serif;

            font-size: 21px;

            letter-spacing: 2px;

            color: #ffffff;

            font-weight: 500;
        }

        .description {

            margin-top: 6px;

            color: #777;

            font-size: 15px;
        }


        /* =====================================================
           LOADING / ERROR
           ===================================================== */

        .loading,
        .empty,
        .error {

            grid-column: 1 / -1;

            text-align: center;

            padding: 70px 10px;

            font-size: 21px;

            color: #777;
        }

        .error {
            color: #c77;
        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 600px) {

            .header {
                height: 92px;

                border-radius:
                    0 0 22px 22px;
            }

            .logo-ix {
                font-size: 38px;
            }

            .logo-wear {
                font-size: 27px;
            }

            main {
                padding:
                    29px 15px 60px;
            }

            .catalog-title {
                margin-bottom: 42px;
            }

            .catalog-title h1 {
                font-size: 20px;

                letter-spacing: 3px;
            }

            .catalog-subtitle {
                font-size: 18px;
            }

            .title-decoration {
                width: 43px;
            }


            /* GRID */

            #products {

                column-gap: 25px;

                row-gap: 70px;
            }


            /* FRAME */

            .frame {

                border-width: 8px;

                aspect-ratio:
                    .76 / 1;

                box-shadow:

                    0 0 0 2px #222,

                    0 0 0 4px #d8d8d8,

                    0 0 0 6px #555,

                    0 0 0 8px #151515,

                    0 12px 27px
                    rgba(0,0,0,.9);
            }

            .frame::before {
                inset: -5px;
            }

            .frame::after {
                inset: 6px;
            }


            /* IMAGE */

            .image-area {

                top: 17px;
                right: 17px;
                bottom: 35px;
                left: 17px;
            }


            /* ORNAMENT */

            .ornament {

                width: 68px;
                height: 68px;
            }

            .ornament::before {

                width: 53px;
                height: 53px;

                left: 7px;
                top: 7px;
            }

            .ornament::after {

                width: 40px;
                height: 40px;

                left: 17px;
                top: 17px;

                border-width: 6px;
            }

            .ornament .flower {

                width: 25px;
                height: 25px;

                left: 21px;
                top: 21px;
            }

            .ornament .petal {

                width: 15px;
                height: 24px;

                left: 26px;
                top: 3px;
            }

            .ornament .petal:nth-child(2) {

                top: 26px;
                left: 42px;
            }

            .ornament .petal:nth-child(3) {

                top: 42px;
                left: 26px;
            }

            .ornament .petal:nth-child(4) {

                top: 26px;
                left: 3px;
            }


            /* POSITIONS */

            .ornament.tl {

                top: -30px;
                left: -30px;
            }

            .ornament.tr {

                top: -30px;
                right: -30px;
            }

            .ornament.bl {

                bottom: -30px;
                left: -30px;
            }

            .ornament.br {

                bottom: -30px;
                right: -30px;
            }


            /* PLAQUE */

            .frame-brand {

                width: 100px;
                height: 34px;

                bottom: -24px;

                border-width: 1px;
            }

            .frame-brand::before {
                inset: 3px;
            }

            .brand-ix {
                font-size: 15px;
            }

            .brand-wear {
                font-size: 15px;
            }


            /* INFO */

            .info {
                padding-top: 34px;
            }

            .name {
                font-size: 17px;
            }

            .price {
                font-size: 15px;

                letter-spacing: 1px;
            }

            .description {
                font-size: 12px;
            }
        }


        /* =====================================================
           VERY SMALL PHONES
           ===================================================== */

        @media (max-width: 380px) {

            main {
                padding-left: 11px;
                padding-right: 11px;
            }

            .logo-ix {
                font-size: 34px;
            }

            .logo-wear {
                font-size: 24px;
            }

            #products {
                column-gap: 19px;
            }

            .name {
                font-size: 15px;
            }

            .price {
                font-size: 14px;
            }
        }

    </style>
</head>


<body>

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="header">

        <div class="logo">
            <span class="logo-ix">IX</span>
            <span class="logo-wear">wear</span>
        </div>

    </header>


    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main>

        <section class="catalog-title">

            <div class="title-line">

                <span class="title-decoration"></span>

                <h1>
                    COLLECTION
                </h1>

                <span class="title-decoration right"></span>

            </div>

            <div class="catalog-subtitle">
                CHOOSE YOUR STYLE
            </div>

        </section>


        <div id="products">

            <div class="loading">
                Loading collection...
            </div>

        </div>

    </main>


    <script>

        /* =====================================================
           TELEGRAM
           ===================================================== */

        const tg =
            window.Telegram.WebApp;

        tg.ready();
        tg.expand();


        /* =====================================================
           CONTAINER
           ===================================================== */

        const container =
            document.getElementById("products");


        /* =====================================================
           ESCAPE HTML
           ===================================================== */

        function escapeHtml(text) {

            const div =
                document.createElement("div");

            div.textContent =
                String(text);

            return div.innerHTML;
        }


        /* =====================================================
           IXWEAR BRAND
           ===================================================== */

        function brandHTML() {

            return `
                <span class="brand-ix">IX</span>
                <span class="brand-wear">wear</span>
            `;
        }


        /* =====================================================
           LOAD PRODUCTS
           ===================================================== */

        async function loadProducts() {

            try {

                const cacheBuster =
                    Date.now() +
                    "_" +
                    Math.random()
                        .toString(36)
                        .substring(2);


                const response =
                    await fetch(
                        "products.json?cache=" +
                        cacheBuster,
                        {
                            method: "GET",

                            cache: "no-store",

                            headers: {
                                "Cache-Control":
                                    "no-cache",

                                "Pragma":
                                    "no-cache"
                            }
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "HTTP " +
                        response.status
                    );
                }


                const products =
                    await response.json();


                if (!Array.isArray(products)) {

                    throw new Error(
                        "products.json имеет неправильный формат"
                    );
                }


                if (products.length === 0) {

                    container.innerHTML = `
                        <div class="empty">
                            Collection is empty
                        </div>
                    `;

                    return;
                }


                let html = "";


                products.forEach(
                    (product, index) => {

                        const name =
                            escapeHtml(
                                product.name || ""
                            );


                        const price =
                            escapeHtml(
                                product.price || ""
                            );


                        const description =
                            escapeHtml(
                                product.description || ""
                            );


                        const imageUrl =
                            product.image
                                ? product.image +
                                  (
                                      product.image.includes("?")
                                      ? "&"
                                      : "?"
                                  ) +
                                  "v=" +
                                  Date.now()
                                : "";


                        html += `

                            <article
                                class="product"
                                style="
                                    animation-delay:
                                    ${index * 0.06}s;
                                "
                            >

                                <div class="frame">

                                    <div class="frame-inner"></div>


                                    <!-- PRODUCT -->

                                    <div class="image-area">

                                        ${
                                            imageUrl
                                            ? `
                                                <img
                                                    src="${imageUrl}"
                                                    alt="${name}"
                                                    loading="lazy"
                                                    onerror="
                                                        this.style.display='none';
                                                    "
                                                >
                                            `
                                            : ""
                                        }

                                    </div>


                                    <!-- TOP LEFT -->

                                    <div class="ornament tl">

                                        <div class="flower"></div>

                                        <div class="petal"></div>
                                        <div class="petal"></div>
                                        <div class="petal"></div>
                                        <div class="petal"></div>

                                    </div>


                                    <!-- TOP RIGHT -->

                                    <div class="ornament tr">

                                        <div class="flower"></div>

                                        <div class="petal"></div>
                                        <div class="petal"></div>
                                        <div class="petal"></div>
                                        <div class="petal"></div>

                                    </div>


                                    <!-- BOTTOM LEFT -->

                                    <div class="ornament bl">

                                        <div class="flower"></div>

                                        <div class="petal"></div>
                                        <div class="petal"></div>
                                        <div class="petal"></div>
                                        <div class="petal"></div>

                                    </div>


                                    <!-- BOTTOM RIGHT -->

                                    <div class="ornament br">

                                        <div class="flower"></div>

                                        <div class="petal"></div>
                                        <div class="petal"></div>
                                        <div class="petal"></div>
                                        <div class="petal"></div>

                                    </div>


                                    <!-- IXWEAR -->

                                    <div class="frame-brand">

                                        ${brandHTML()}

                                    </div>

                                </div>


                                <!-- PRODUCT INFO -->

                                <div class="info">

                                    <div class="name">
                                        ${name}
                                    </div>

                                    <div class="price">
                                        ${price}
                                    </div>

                                    ${
                                        description
                                        ? `
                                            <div class="description">
                                                ${description}
                                            </div>
                                        `
                                        : ""
                                    }

                                </div>

                            </article>

                        `;
                    }
                );


                container.innerHTML =
                    html;


            } catch (error) {

                console.error(
                    "Ошибка загрузки каталога:",
                    error
                );


                container.innerHTML = `

                    <div class="error">

                        Could not load collection.

                        <br><br>

                        ${escapeHtml(
                            error.message
                        )}

                    </div>

                `;
            }
        }


        /* =====================================================
           START
           ===================================================== */

        loadProducts();


        /* =====================================================
           AUTO UPDATE
           ===================================================== */

        setInterval(
            loadProducts,
            3000
        );

    </script>

</body>
</html>
