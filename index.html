<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        http-equiv="Cache-Control"
        content="no-cache, no-store, must-revalidate"
    >

    <meta
        http-equiv="Pragma"
        content="no-cache"
    >

    <meta
        http-equiv="Expires"
        content="0"
    >

    <title>Каталог IXwear</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            padding: 16px;

            background: #ffffff;
            color: #111111;

            font-family: Arial, sans-serif;
        }


        h1 {
            margin: 5px 0 20px;

            font-size: 24px;
            font-weight: 700;
        }


        #products {

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 14px;
        }


        /* =====================================================
           КАРТОЧКА ТОВАРА
           ===================================================== */

        .product {

            position: relative;

            border: 2px solid #111111;

            border-radius: 0;

            overflow: hidden;

            background: #ffffff;

            box-shadow:
                4px 4px 0 #111111;

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }


        .product:active {

            transform: translate(
                3px,
                3px
            );

            box-shadow:
                1px 1px 0 #111111;
        }


        /* =====================================================
           ФОТО
           ===================================================== */

        .product img {

            width: 100%;

            aspect-ratio: 1 / 1;

            object-fit: cover;

            display: block;

            background: #f5f5f5;

            border-bottom:
                2px solid #111111;
        }


        /* =====================================================
           ИНФОРМАЦИЯ
           ===================================================== */

        .info {

            padding: 10px;
        }


        .name {

            font-size: 15px;

            font-weight: 700;

            margin-bottom: 5px;

            word-break: break-word;
        }


        .price {

            font-size: 16px;

            font-weight: 700;

            margin-bottom: 8px;
        }


        .description {

            font-size: 12px;

            color: #777777;

            line-height: 1.3;

            word-break: break-word;

            margin-bottom: 8px;
        }


        /* =====================================================
           IXwear
           ===================================================== */

        .brand {

            padding-top: 8px;

            margin-top: 8px;

            border-top:
                1px solid #dddddd;

            font-size: 11px;

            font-weight: 800;

            letter-spacing: 2px;

            text-transform: uppercase;

            color: #111111;
        }


        /* =====================================================
           СОСТОЯНИЯ
           ===================================================== */

        .empty {

            grid-column: 1 / -1;

            text-align: center;

            padding: 50px 10px;

            color: #777777;
        }


        .error {

            grid-column: 1 / -1;

            padding: 20px;

            color: #cc0000;

            text-align: center;
        }


        .loading {

            grid-column: 1 / -1;

            text-align: center;

            padding: 50px 10px;

            color: #777777;
        }

    </style>

</head>

<body>

    <h1>Каталог</h1>

    <div id="products">

        <div class="loading">
            Загрузка товаров...
        </div>

    </div>


    <script>

        // =====================================================
        // TELEGRAM
        // =====================================================

        const tg = window.Telegram.WebApp;

        tg.ready();

        tg.expand();


        // =====================================================
        // КОНТЕЙНЕР
        // =====================================================

        const container =
            document.getElementById("products");


        // =====================================================
        // ЭКРАНИРОВАНИЕ ТЕКСТА
        // =====================================================

        function escapeHtml(text) {

            const div =
                document.createElement("div");

            div.textContent =
                String(text);

            return div.innerHTML;
        }


        // =====================================================
        // ЗАГРУЗКА ТОВАРОВ
        // =====================================================

        async function loadProducts() {

            try {

                const cacheBuster =
                    Date.now() +
                    "_" +
                    Math.random()
                        .toString(36)
                        .substring(2);


                const url =
                    "products.json?cache=" +
                    cacheBuster;


                const response =
                    await fetch(
                        url,
                        {
                            method: "GET",

                            cache: "no-store",

                            headers: {
                                "Cache-Control":
                                    "no-cache",

                                "Pragma":
                                    "no-cache"
                            }
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "HTTP " +
                        response.status
                    );
                }


                const products =
                    await response.json();


                // =================================================
                // ПРОВЕРКА
                // =================================================

                if (
                    !Array.isArray(products)
                ) {

                    throw new Error(
                        "products.json имеет неправильный формат"
                    );
                }


                // =================================================
                // ПУСТО
                // =================================================

                if (
                    products.length === 0
                ) {

                    container.innerHTML = `

                        <div class="empty">

                            Каталог пока пуст

                        </div>

                    `;

                    return;
                }


                // =================================================
                // СОЗДАЁМ HTML
                // =================================================

                let html = "";


                products.forEach(
                    (product, index) => {

                        const name =
                            escapeHtml(
                                product.name || ""
                            );


                        const price =
                            escapeHtml(
                                product.price || ""
                            );


                        const description =
                            escapeHtml(
                                product.description || ""
                            );


                        let imageHtml = "";


                        if (
                            product.image
                        ) {

                            const imageUrl =
                                product.image +
                                (
                                    product.image.includes("?")
                                    ? "&"
                                    : "?"
                                ) +
                                "v=" +
                                Date.now();


                            imageHtml = `

                                <img

                                    src="${imageUrl}"

                                    alt="${name}"

                                    loading="lazy"

                                    onerror="
                                        this.style.display='none';
                                    "

                                >

                            `;
                        }


                        html += `

                            <div class="product">

                                ${imageHtml}

                                <div class="info">

                                    <div class="name">

                                        ${name}

                                    </div>


                                    <div class="price">

                                        ${price}

                                    </div>


                                    ${
                                        description
                                        ? `

                                            <div
                                                class="description"
                                            >

                                                ${description}

                                            </div>

                                        `
                                        : ""
                                    }


                                    <div class="brand">

                                        IXwear

                                    </div>

                                </div>

                            </div>

                        `;
                    }
                );


                // =================================================
                // ВЫВОДИМ
                // =================================================

                container.innerHTML =
                    html;


            } catch (error) {

                console.error(
                    "Ошибка загрузки каталога:",
                    error
                );


                container.innerHTML = `

                    <div class="error">

                        Не удалось загрузить каталог.

                        <br><br>

                        ${escapeHtml(
                            error.message
                        )}

                    </div>

                `;
            }
        }


        // =====================================================
        // ПЕРВАЯ ЗАГРУЗКА
        // =====================================================

        loadProducts();


        // =====================================================
        // АВТООБНОВЛЕНИЕ
        // =====================================================

        setInterval(
            loadProducts,
            3000
        );

    </script>

</body>
</html>
