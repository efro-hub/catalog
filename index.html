<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        http-equiv="Cache-Control"
        content="no-cache, no-store, must-revalidate"
    >

    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>IXwear</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600&family=UnifrakturCook:wght@700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            background: #080808;
            color: #ffffff;
        }

        body {
            font-family: "Cormorant Garamond", serif;
            overflow-x: hidden;
        }


        /* =====================================================
           HEADER
           ===================================================== */

        .header {
            height: 130px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 34px;

            background:
                linear-gradient(
                    180deg,
                    #101010 0%,
                    #0b0b0b 100%
                );

            border-bottom: 1px solid #1c1c1c;

            position: relative;
        }


        .header-button {
            width: 48px;
            height: 48px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: transparent;
            border: 0;
            padding: 0;
        }


        /* =====================================================
           BURGER
           ===================================================== */

        .burger {
            width: 40px;
            height: 30px;

            display: flex;
            flex-direction: column;

            justify-content: space-between;
        }

        .burger span {
            display: block;

            width: 40px;
            height: 4px;

            border-radius: 5px;

            background: #ffffff;
        }


        /* =====================================================
           LOGO
           ===================================================== */

        .logo {
            position: absolute;

            left: 50%;

            transform: translateX(-50%);

            white-space: nowrap;

            font-family:
                "UnifrakturCook",
                "Cinzel",
                serif;

            font-size: 47px;

            line-height: 1;

            color: #ffffff;

            text-shadow:
                0 0 8px rgba(255,255,255,0.08);
        }


        /* =====================================================
           BAG
           ===================================================== */

        .bag {
            width: 34px;
            height: 32px;

            position: relative;

            border: 3px solid #ffffff;

            border-radius: 3px 3px 5px 5px;
        }

        .bag::before {
            content: "";

            position: absolute;

            width: 15px;
            height: 12px;

            left: 50%;
            top: -12px;

            transform: translateX(-50%);

            border: 3px solid #ffffff;

            border-bottom: 0;

            border-radius: 10px 10px 0 0;
        }


        /* =====================================================
           MAIN
           ===================================================== */

        main {
            width: 100%;

            max-width: 1100px;

            margin: 0 auto;

            padding: 32px 22px 50px;
        }


        /* =====================================================
           TITLE
           ===================================================== */

        .catalog-title {
            text-align: center;

            margin: 0 0 28px;
        }


        .title-line {
            display: flex;

            align-items: center;
            justify-content: center;

            gap: 15px;
        }


        .title-decoration {
            width: 55px;
            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #777777
                );
        }


        .title-decoration.right {
            background:
                linear-gradient(
                    90deg,
                    #777777,
                    transparent
                );
        }


        .catalog-title h1 {
            margin: 0;

            font-family:
                "Cinzel",
                serif;

            font-size: 27px;

            font-weight: 500;

            letter-spacing: 5px;

            color: #eeeeee;
        }


        .catalog-subtitle {
            margin: 8px 0 0;

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 22px;

            color: #cfcfcf;

            letter-spacing: 1px;
        }


        /* =====================================================
           PRODUCTS
           ===================================================== */

        #products {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            column-gap: 25px;

            row-gap: 42px;
        }


        /* =====================================================
           PRODUCT
           ===================================================== */

        .product {
            min-width: 0;

            text-align: center;

            animation:
                productAppear 0.45s ease both;
        }


        @keyframes productAppear {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* =====================================================
           FRAME
           ===================================================== */

        .frame {
            position: relative;

            width: 100%;

            aspect-ratio: 0.78 / 1;

            padding: 17px;

            background:
                linear-gradient(
                    135deg,
                    #f7f7f7 0%,
                    #bcbcbc 18%,
                    #ffffff 35%,
                    #9c9c9c 52%,
                    #f3f3f3 70%,
                    #a5a5a5 86%,
                    #fafafa 100%
                );

            box-shadow:
                0 0 0 2px #777777,
                0 0 0 5px #dddddd,
                0 8px 22px rgba(0,0,0,0.6);

            overflow: visible;
        }


        /* =====================================================
           ВНУТРЕННЯЯ РАМКА
           ===================================================== */

        .frame::before {
            content: "";

            position: absolute;

            inset: 10px;

            border: 2px solid #6d6d6d;

            box-shadow:
                inset 0 0 0 2px #f4f4f4;

            pointer-events: none;

            z-index: 2;
        }


        /* =====================================================
           ВНЕШНЯЯ ЛИНИЯ
           ===================================================== */

        .frame::after {
            content: "";

            position: absolute;

            inset: -7px;

            border: 1px solid #eeeeee;

            pointer-events: none;

            z-index: 3;
        }


        /* =====================================================
           УГЛЫ РАМКИ
           ===================================================== */

        .corner {
            position: absolute;

            width: 46px;
            height: 46px;

            z-index: 5;

            pointer-events: none;
        }


        .corner::before,
        .corner::after {
            content: "";

            position: absolute;

            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #888888,
                    #ffffff
                );
        }


        .corner::before {
            width: 42px;
            height: 9px;

            top: 18px;
            left: 2px;

            transform: rotate(45deg);

            box-shadow:
                0 0 2px #444444;
        }


        .corner::after {
            width: 42px;
            height: 9px;

            top: 18px;
            left: 2px;

            transform: rotate(-45deg);

            box-shadow:
                0 0 2px #444444;
        }


        .corner.tl {
            top: -13px;
            left: -13px;
        }

        .corner.tr {
            top: -13px;
            right: -13px;

            transform: rotate(90deg);
        }

        .corner.br {
            bottom: -13px;
            right: -13px;

            transform: rotate(180deg);
        }

        .corner.bl {
            bottom: -13px;
            left: -13px;

            transform: rotate(270deg);
        }


        /* =====================================================
           ФОТО ТОВАРА
           ===================================================== */

        .image-area {
            position: absolute;

            left: 17px;
            right: 17px;

            top: 17px;
            bottom: 48px;

            overflow: hidden;

            background: #080808;

            display: flex;

            align-items: center;
            justify-content: center;

            z-index: 1;
        }


        .product img {
            width: 100%;
            height: 100%;

            object-fit: contain;

            display: block;

            background: #080808;
        }


        /* =====================================================
           IXWEAR НА РАМКЕ
           ===================================================== */

        .frame-brand {
            position: absolute;

            left: 50%;

            bottom: -14px;

            transform: translateX(-50%);

            z-index: 7;

            min-width: 90px;

            padding: 3px 13px 5px;

            background:
                linear-gradient(
                    180deg,
                    #f5f5f5,
                    #bdbdbd
                );

            color: #050505;

            font-family:
                "UnifrakturCook",
                serif;

            font-size: 20px;

            line-height: 1;

            white-space: nowrap;

            border: 1px solid #777777;

            box-shadow:
                0 2px 5px rgba(0,0,0,0.5);
        }


        /* =====================================================
           ИНФОРМАЦИЯ
           ===================================================== */

        .info {
            padding-top: 19px;

            text-align: center;
        }


        .name {
            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 21px;

            font-weight: 500;

            line-height: 1.15;

            color: #eeeeee;

            word-break: break-word;
        }


        .price {
            margin-top: 4px;

            font-family:
                "Cinzel",
                serif;

            font-size: 20px;

            font-weight: 500;

            letter-spacing: 2px;

            color: #ffffff;
        }


        .description {
            margin-top: 5px;

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 15px;

            line-height: 1.2;

            color: #999999;
        }


        /* =====================================================
           ЗАГРУЗКА / ПУСТО / ОШИБКА
           ===================================================== */

        .loading,
        .empty,
        .error {
            grid-column: 1 / -1;

            text-align: center;

            padding: 60px 10px;

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 20px;

            color: #888888;
        }


        .error {
            color: #d88b8b;
        }


        /* =====================================================
           МОБИЛЬНЫЙ РАЗМЕР
           ===================================================== */

        @media (max-width: 480px) {

            .header {
                height: 100px;

                padding: 0 24px;
            }


            .logo {
                font-size: 38px;
            }


            .burger {
                width: 34px;
                height: 27px;
            }


            .burger span {
                width: 34px;
                height: 3px;
            }


            .bag {
                width: 29px;
                height: 28px;
            }


            main {
                padding: 27px 15px 45px;
            }


            .catalog-title h1 {
                font-size: 22px;

                letter-spacing: 3px;
            }


            .catalog-subtitle {
                font-size: 19px;
            }


            .title-decoration {
                width: 35px;
            }


            #products {
                column-gap: 17px;

                row-gap: 35px;
            }


            .frame {
                padding: 12px;
            }


            .frame::before {
                inset: 7px;
            }


            .image-area {
                left: 12px;
                right: 12px;

                top: 12px;
                bottom: 39px;
            }


            .frame-brand {
                font-size: 16px;

                min-width: 73px;

                padding: 3px 9px 4px;
            }


            .corner {
                transform:
                    scale(0.78);
            }


            .corner.tr {
                transform:
                    rotate(90deg)
                    scale(0.78);
            }


            .corner.br {
                transform:
                    rotate(180deg)
                    scale(0.78);
            }


            .corner.bl {
                transform:
                    rotate(270deg)
                    scale(0.78);
            }


            .name {
                font-size: 17px;
            }


            .price {
                font-size: 16px;

                letter-spacing: 1px;
            }


            .description {
                font-size: 13px;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="header">

        <button
            class="header-button"
            type="button"
            aria-label="Menu"
        >

            <div class="burger">

                <span></span>
                <span></span>
                <span></span>

            </div>

        </button>


        <div class="logo">
            IXwear
        </div>


        <button
            class="header-button"
            type="button"
            aria-label="Cart"
        >

            <div class="bag"></div>

        </button>

    </header>


    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main>

        <section class="catalog-title">

            <div class="title-line">

                <span class="title-decoration"></span>

                <h1>COLLECTION</h1>

                <span
                    class="title-decoration right"
                ></span>

            </div>


            <div class="catalog-subtitle">
                CHOOSE YOUR STYLE
            </div>

        </section>


        <div id="products">

            <div class="loading">
                Loading collection...
            </div>

        </div>

    </main>


    <script>

        // =====================================================
        // TELEGRAM
        // =====================================================

        const tg = window.Telegram.WebApp;

        tg.ready();
        tg.expand();


        // =====================================================
        // КОНТЕЙНЕР
        // =====================================================

        const container =
            document.getElementById("products");


        // =====================================================
        // ЭКРАНИРОВАНИЕ
        // =====================================================

        function escapeHtml(text) {

            const div =
                document.createElement("div");

            div.textContent =
                String(text);

            return div.innerHTML;
        }


        // =====================================================
        // ЗАГРУЗКА ТОВАРОВ
        // =====================================================

        async function loadProducts() {

            try {

                const cacheBuster =
                    Date.now() +
                    "_" +
                    Math.random()
                        .toString(36)
                        .substring(2);


                const url =
                    "products.json?cache=" +
                    cacheBuster;


                const response =
                    await fetch(
                        url,
                        {
                            method: "GET",

                            cache: "no-store",

                            headers: {
                                "Cache-Control":
                                    "no-cache",

                                "Pragma":
                                    "no-cache"
                            }
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "HTTP " +
                        response.status
                    );
                }


                const products =
                    await response.json();


                if (!Array.isArray(products)) {

                    throw new Error(
                        "products.json имеет неправильный формат"
                    );
                }


                if (products.length === 0) {

                    container.innerHTML = `

                        <div class="empty">
                            Collection is empty
                        </div>

                    `;

                    return;
                }


                // =================================================
                // СОЗДАНИЕ КАРТОЧЕК
                // =================================================

                let html = "";


                products.forEach(
                    (product, index) => {

                        const name =
                            escapeHtml(
                                product.name || ""
                            );


                        const price =
                            escapeHtml(
                                product.price || ""
                            );


                        const description =
                            escapeHtml(
                                product.description || ""
                            );


                        let imageHtml = "";


                        if (product.image) {

                            const imageUrl =
                                product.image +
                                (
                                    product.image.includes("?")
                                    ? "&"
                                    : "?"
                                ) +
                                "v=" +
                                Date.now();


                            imageHtml = `

                                <div class="image-area">

                                    <img
                                        src="${imageUrl}"
                                        alt="${name}"
                                        loading="lazy"
                                        onerror="
                                            this.style.display='none';
                                        "
                                    >

                                </div>

                            `;
                        }


                        html += `

                            <article
                                class="product"
                                style="
                                    animation-delay:
                                    ${index * 0.05}s;
                                "
                            >

                                <div class="frame">

                                    ${imageHtml}

                                    <div class="corner tl"></div>
                                    <div class="corner tr"></div>
                                    <div class="corner br"></div>
                                    <div class="corner bl"></div>

                                    <div class="frame-brand">
                                        IXwear
                                    </div>

                                </div>


                                <div class="info">

                                    <div class="name">
                                        ${name}
                                    </div>


                                    <div class="price">
                                        ${price}
                                    </div>


                                    ${
                                        description
                                        ? `

                                            <div class="description">
                                                ${description}
                                            </div>

                                        `
                                        : ""
                                    }

                                </div>

                            </article>

                        `;
                    }
                );


                container.innerHTML =
                    html;


            } catch (error) {

                console.error(
                    "Ошибка загрузки каталога:",
                    error
                );


                container.innerHTML = `

                    <div class="error">

                        Could not load collection.

                        <br><br>

                        ${escapeHtml(
                            error.message
                        )}

                    </div>

                `;
            }
        }


        // =====================================================
        // ПЕРВАЯ ЗАГРУЗКА
        // =====================================================

        loadProducts();


        // =====================================================
        // АВТООБНОВЛЕНИЕ
        // =====================================================

        setInterval(
            loadProducts,
            3000
        );

    </script>

</body>
</html>
